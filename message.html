<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no,date=no,email=no,address=no">
<meta name="theme-color" content="#ffffff">
<title>강영현의 iPhone</title>
<style>
:root{--blue:#007aff;--ink:#111113;--sub:#8e8e93;--line:#e8e8ed;--bg:#fff;--soft:#f2f2f7;--incoming:#e9e9eb;--sms:#34c759}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body,button,input,textarea{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
button,input,textarea{font-size:16px}button{border:0;background:none;padding:0;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}input:focus,input:focus-visible,textarea:focus,textarea:focus-visible{outline:0!important;outline-offset:0!important;box-shadow:none!important;-webkit-box-shadow:none!important}button:active{opacity:.7}svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}[hidden]{display:none!important}
#app{position:fixed;inset:0;height:100%;height:100dvh;width:100%;display:flex;flex-direction:column;overflow:hidden;background:white}#header{z-index:3;flex:none;background:#fff;border-bottom:1px solid var(--line)}#content{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;background:#fff}#content::-webkit-scrollbar{display:none}#footer{flex:none;z-index:3;background:#fafafa;border-top:1px solid var(--line)}
.shell{width:100%;min-width:0;margin:0 auto;max-width:none}
/* 메시지 목록 */
.list-head{padding:21px 20px 15px}.list-head h1{font-size:34px;font-weight:760;letter-spacing:-1.5px;line-height:1.2;margin:0 0 19px}.searchbox{display:flex;align-items:center;gap:10px;width:100%;height:40px;border-radius:12px;background:#f0f0f3;padding:0 12px;color:#919197}.searchbox>svg{height:20px;width:20px;flex:none;stroke-width:2}.searchbox input{flex:1;min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;font-size:16px;appearance:none;-webkit-appearance:none;color:#141416}.searchbox input::placeholder{color:#9b9ba0}.clear-search{width:23px;height:23px;flex:none;background:#9a9aa0;border-radius:50%;color:white;font-size:20px;line-height:1;display:grid;place-items:center;padding-bottom:2px}
.thread{width:100%;display:flex;align-items:center;text-align:left;gap:13px;min-height:81px;padding:0 18px;background:#fff}.thread:active{background:#f5f5f8}.thread-inactive{cursor:default}.thread-inactive:active{background:#fff;opacity:1}.thread-body{flex:1;min-width:0;min-height:81px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line);padding:14px 0 13px}.thread:last-child .thread-body{border-bottom:0}.thread-head{display:flex;align-items:baseline;gap:9px;justify-content:space-between}.thread-name{font-size:16px;font-weight:650;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.thread-date{font-size:12px;color:#9a9aa0;white-space:nowrap;flex:none}.thread-preview{font-size:14px;color:#929298;line-height:1.4;margin-top:5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow-wrap:anywhere}.avatar{width:50px;height:50px;border-radius:50%;background:#d1d1d6;color:#fff;display:grid;place-items:center;flex:none;font-size:24px;font-weight:600;letter-spacing:-1px}.avatar.numeric{font-size:29px;font-weight:400}.avatar svg{height:30px;width:30px;fill:white;stroke:none}.empty{padding:75px 16px;text-align:center;color:#96969d;font-size:14px}
/* 대화방 상단: 기존 iMessage 형태 */
.chat-head{height:107px;padding:7px 17px 10px;display:grid;grid-template-columns:1fr minmax(0,3fr) 1fr;align-items:center}.back-btn{color:var(--blue);width:42px;height:42px;display:grid;place-items:center;justify-self:start}.back-btn svg{height:27px;width:27px;stroke-width:2.3}.contact-head{justify-self:center;align-self:center;min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}.contact-head .avatar{width:44px;height:44px}.contact-head .avatar svg{width:27px;height:27px}.contact-name{font-size:12px;font-weight:650;max-width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;text-align:center;letter-spacing:-.25px}.video-icon{width:39px;height:39px;color:#626268;justify-self:end;display:grid;place-items:center}.video-icon svg{width:26px;height:26px;stroke-width:1.8}
.video-icon[role="button"]:focus-visible,#dw-facetime-replay:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:9px}
/* 대화 말풍선 */
.message-list{padding:16px 16px 22px;min-height:100%;display:flex;flex-direction:column;gap:6px}.secure-label{text-align:center;font-size:11px;line-height:1.5;color:#9a9ba1;padding:4px 0 8px}.secure-label svg{height:12px;width:12px;display:inline-block;vertical-align:-2px}.day-divider{font-size:11px;font-weight:650;color:#a0a0a6;text-align:center;margin:16px 0 11px}.bubble-row{display:flex;width:100%;align-items:flex-end}.bubble-row.me{justify-content:flex-end}.bubble-row.them{justify-content:flex-start}.bubble{max-width:min(79%,390px);border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.47;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all}.them .bubble{background:#e9e9eb;color:#111;border-bottom-left-radius:5px}.me .bubble{background:var(--blue);color:white;border-bottom-right-radius:5px}.me.sms .bubble{background:var(--sms)}.delivered{text-align:right;font-size:10px;color:#a0a0a6;margin:3px 4px}
/* 입력창: 작고 얇은 회색 + / 흰 입력 캡슐 / 오른쪽 회색 음성, 입력하면 파란 전송 */
.chat-bottom{padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));min-height:54px;display:flex;gap:10px;align-items:center}.plus-button{color:#96969c;width:27px;height:33px;flex:none;display:grid;place-items:center;cursor:default}.plus-button svg{width:22px;height:22px;stroke-width:1.75}.input-wrap{flex:1;min-width:0;min-height:38px;max-height:125px;border:1px solid #dcdce2;background:white;border-radius:22px;display:flex;align-items:center;padding:5px 13px}.chat-input{display:block;resize:none;min-width:0;flex:1;min-height:26px;height:26px;max-height:105px;overflow:auto;border:none;outline:none;background:none;font-size:16px;line-height:26px;padding:0;scrollbar-width:none}.chat-input::placeholder{color:#bcbcc2}.action-button{width:29px;height:38px;flex:none;display:grid;place-items:center;color:#94949a}.action-button svg{width:22px;height:22px;stroke-width:2}.action-button.sending{color:var(--blue)}.action-button.sending svg{background:var(--blue);border-radius:50%;width:27px;height:27px;padding:5px;stroke-width:2.8;color:white}
/* DBS 인트라넷과 동일한 반응형 원칙:
   뷰포트 전체를 앱이 채우고, 화면이 넓을 때에는 읽는 영역만 적당한 폭으로 중앙 정렬.
   헤더·입력창·키보드는 항상 화면 좌우 끝까지 이어집니다. */
#app,#header,#content,#footer{width:100%;max-width:none;min-width:0;margin-left:0;margin-right:0}
#app{height:100%;height:100dvh;background:#fff}
#content{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
#header{flex:0 0 auto;background:#fff}
#footer{flex:0 0 auto;background:#fafafa}
@media(min-width:700px){
  #header,#content,#footer{max-width:none;width:100%;margin:0}
  #content>.shell,.list-head.shell{max-width:680px;margin-left:auto;margin-right:auto}
  .chat-head.shell,.chat-bottom.shell{width:100%;max-width:none;margin-left:0;margin-right:0}
  .chat-head{padding-left:20px;padding-right:20px}
  .chat-bottom{padding-left:max(16px,calc((100% - 680px)/2));padding-right:max(16px,calc((100% - 680px)/2))}
  .script-key-row{max-width:680px;margin-left:auto;margin-right:auto}
}
@media(max-width:345px){.list-head{padding-left:16px;padding-right:16px}.thread{padding:0 14px;gap:10px}.thread-name{font-size:14px}.thread-date{font-size:11px}.bubble{font-size:14px;max-width:86%}.chat-bottom{gap:7px;padding-left:11px;padding-right:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* 윤도운이 대화: iPhone 키보드가 실제로 입력하는 듯한 시각 연출 (페이지 내부 전용) */
#footer.is-playing .chat-bottom{padding-bottom:8px}
#footer.is-playing .chat-input{caret-color:var(--blue)}
.script-keyboard{background:#d2d6de;border-top:1px solid #bec3cc;padding:7px 4px calc(11px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none;pointer-events:none;animation:keypad-rise .24s ease-out both}
.script-key-row{display:flex;justify-content:center;gap:4px;margin:0 0 9px}
.script-key{display:grid;place-items:center;flex:1;min-width:0;height:37px;border-radius:5px;background:#fff;color:#25272b;font-size:18px;font-weight:440;box-shadow:0 1px 0 #aab0b8;line-height:1}
 .script-key.special{background:#afb8c6;flex:1.25;color:#3c444f;font-size:15px}.script-key.small{font-size:12px}.script-key.space{flex:5;font-size:13px}.script-key.return{background:#aeb8c8;font-size:12px;flex:1.7}
/* 실제 입력되는 자모와 일치하는 자판이 순간적으로 눌리는 연출 */
.script-key.is-pressed{background:#9aa6b8!important;color:#fff!important;box-shadow:inset 0 1px 3px #5b667d77!important;transform:translateY(2px) scale(.955)!important;transition:transform .06s ease,background .06s ease}
.script-key.special.is-pressed{background:#8994a7!important}
.script-key.emoji-key{font-size:17px}
.input-wrap:focus-within{border-color:#dcdce2!important;outline:0!important;box-shadow:none!important}
.chat-input:focus,.chat-input:focus-visible{outline:none!important;box-shadow:none!important;border:0!important;-webkit-appearance:none;appearance:none}
.searchbox:focus-within{outline:none!important;box-shadow:none!important}

.script-typing{align-self:flex-start;display:flex;align-items:center;gap:5px;height:33px;padding:0 14px;background:#e9e9eb;border-radius:17px;margin-top:5px}
.script-typing i{width:6px;height:6px;border-radius:50%;background:#9b9ba2;animation:dot-typing 1.05s ease-in-out infinite}.script-typing i:nth-child(2){animation-delay:.17s}.script-typing i:nth-child(3){animation-delay:.34s}
@keyframes keypad-rise{from{opacity:.5;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes dot-typing{0%,55%,100%{opacity:.3;transform:translateY(0)}25%{opacity:1;transform:translateY(-3px)}}
@media(max-height:670px){.script-key-row{margin-bottom:6px}.script-key{height:29px;font-size:15px}.script-keyboard{padding-top:5px}}
@media(max-width:345px){.chat-bottom{gap:7px;padding-left:10px;padding-right:10px}.plus-button{width:24px}.plus-button svg{width:21px;height:21px}.script-key-row{gap:3px}.script-key{height:33px;font-size:16px}}
@media(prefers-reduced-motion:reduce){.script-keyboard,.script-typing i{animation:none!important}}
/* 큰 화면에서도 키보드 바탕은 전체 너비, 키 배열만 메시지 영역과 같은 중앙 너비 */
@media(min-width:700px){
 #footer .script-key-row{width:calc(100% - 8px);max-width:680px;margin:0 auto 9px}
}


/* 10초 수신 알림 · 프로필 아이콘 없이 텍스트 + 버튼만 표시 */
#ft-mini-call{position:fixed;top:calc(9px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-12px);width:min(360px,calc(100% - 20px));min-height:65px;padding:9px 11px 9px 16px;display:flex;align-items:center;gap:9px;background:rgba(9,10,14,.69);border:1px solid rgba(255,255,255,.14);border-radius:36px;color:#fff;box-shadow:0 7px 19px rgba(0,0,0,.22);z-index:1200;opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}
#ft-mini-call.visible{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ft-mini-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.ft-mini-type{color:#aaaab2;font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft-mini-name{font-size:15px;font-weight:650;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ft-mini-btn{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:opacity .15s}
.ft-mini-btn:active{opacity:.66}
.ft-mini-btn svg{width:22px;height:22px;display:block;fill:white}
.ft-mini-btn.reject{background:#ff453a}
.ft-mini-btn.accept{background:#30d158}
.ft-mini-btn.reject svg{transform:rotate(135deg)}
/* 참고 이미지 기반: 화면 가득 도운이 영상 + 위쪽에 5개 동그란 제어 버튼 */
#ft-video-call{position:fixed;inset:0;height:100%;height:100dvh;width:100%;z-index:1100;overflow:hidden;background:#090a0c;color:#fff;isolation:isolate}
#ft-video-call video{display:block}
#ft-dowoon-video{position:absolute;inset:0;height:100%;width:100%;object-fit:cover;object-position:center;background:#14181d}
.ft-video-overlay{pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.14) 27%,transparent 48%,rgba(0,0,0,.07))}
.ft-call-top{position:absolute;z-index:2;left:clamp(17px,5vw,35px);top:calc(36px + env(safe-area-inset-top,0px));text-shadow:0 1px 7px #0008}
.ft-call-name{font-size:clamp(21px,5vw,27px);font-weight:660;letter-spacing:-.6px}
.ft-call-duration{font-size:13px;color:#efeff2;line-height:1.5;margin-top:3px;font-variant-numeric:tabular-nums}
.ft-call-controls{position:absolute;z-index:4;top:calc(128px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(3px,1.6vw,12px);width:min(620px,calc(100% - 20px));padding:0;align-items:start}
.ft-control{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;min-width:0;color:#fff;font-size:clamp(10px,2.7vw,12px);font-weight:500;text-shadow:0 1px 6px #0009}
.ft-control-circle{width:clamp(49px,13.2vw,68px);height:clamp(49px,13.2vw,68px);border-radius:50%;background:rgba(77,80,89,.46);display:grid;place-items:center;transition:background .16s,color .16s}
.ft-control-circle svg{width:clamp(23px,6vw,29px);height:clamp(23px,6vw,29px);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.ft-control:active .ft-control-circle{filter:brightness(1.15)}
.ft-control[aria-pressed="true"] .ft-control-circle{background:rgba(245,245,247,.79);color:#202124}
.ft-control-circle.ft-control-end{background:#ff453a}
.ft-control-end svg{stroke:#fff;stroke-width:2.8}
.ft-control[disabled]{opacity:1;cursor:default}
.ft-control[disabled]:active .ft-control-circle{filter:none}
/* 작은 영상은 드래그 가능: 화면 밖으로 못 나가도록 자바스크립트에서 제한합니다. */
.ft-pip{position:absolute;z-index:5;right:15px;top:44%;width:clamp(112px,29vw,184px);height:clamp(155px,40vw,250px);border-radius:15px;border:1px solid #ffffff73;overflow:hidden;background:#30343a;box-shadow:0 5px 22px #0009;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:left,top}
.ft-pip.dragging{cursor:grabbing;box-shadow:0 9px 24px #000b}
#ft-yeonghyeon-video{width:100%;height:100%;object-fit:cover;object-position:50% 75%;pointer-events:none}
.ft-pip-label{position:absolute;bottom:8px;left:10px;font-size:11px;font-weight:650;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none}
#ft-camera-off{position:absolute;inset:0;display:grid;place-items:center;background:#30343a;font-size:13px;font-weight:650;pointer-events:none}
#ft-video-play{position:absolute;z-index:7;left:50%;top:63%;transform:translate(-50%,-50%);background:#fff;color:#161618;padding:12px 20px;border-radius:22px;white-space:nowrap;font-size:13px;font-weight:700;box-shadow:0 5px 16px #0007}
@media(max-width:355px){#ft-mini-call{gap:7px;padding:8px 9px 8px 14px;min-height:60px}.ft-mini-btn{width:40px;height:40px;flex-basis:40px}.ft-mini-btn svg{width:21px;height:21px}.ft-mini-name{font-size:14px}.ft-mini-type{font-size:10px}.ft-call-controls{top:calc(119px + env(safe-area-inset-top,0px))}}
@media(max-height:575px){.ft-call-top{top:calc(10px + env(safe-area-inset-top,0px))}.ft-call-controls{top:calc(85px + env(safe-area-inset-top,0px))}.ft-pip{height:125px;width:95px}}
@media(prefers-reduced-motion:reduce){#ft-mini-call{transition:none}}

/* FaceTime 버튼은 iMessage 공통 svg보다 독립 스타일 우선 */
#ft-mini-call svg,#ft-video-call svg{fill:none;stroke:currentColor}
#ft-mini-call .ft-mini-btn svg{fill:#fff;stroke:none}
#ft-mini-call .ft-mini-btn.reject svg{fill:#fff;stroke:none}
#ft-mini-call .ft-mini-btn.accept svg{fill:#fff;stroke:none}
#ft-video-call .ft-control-end svg{fill:none;stroke:currentColor}

</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <main id="content" role="main"></main>
  <footer id="footer" hidden></footer>


</div>
<!-- iPhone 상단 소형 FaceTime 수신 배너 -->
<div id="ft-mini-call" role="dialog" aria-label="윤도운이 FaceTime 영상 통화" aria-live="polite" hidden>
  <div class="ft-mini-info"><span class="ft-mini-name">윤도운이</span><span class="ft-mini-type">FaceTime 영상 통화</span></div>
  <button class="ft-mini-btn reject" id="ft-decline" aria-label="거절" type="button"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
  <button class="ft-mini-btn accept" id="ft-accept" aria-label="받기" type="button"><svg viewBox="0 0 24 24"><path d="M17.2 10.2V7.5A2.5 2.5 0 0 0 14.7 5H4.5A2.5 2.5 0 0 0 2 7.5v9A2.5 2.5 0 0 0 4.5 19h10.2a2.5 2.5 0 0 0 2.5-2.5v-2.7L22 18V6l-4.8 4.2z"/></svg></button>
</div>
<!-- 수락 시 표시되는 영상 통화 -->
<section id="ft-video-call" role="dialog" aria-label="FaceTime 영상 통화 화면" aria-modal="true" hidden>
  <video id="ft-dowoon-video" playsinline webkit-playsinline preload="metadata"></video>
  <div class="ft-video-overlay"></div>
  <div class="ft-call-top"><div class="ft-call-name">윤도운이</div><div class="ft-call-duration" id="ft-call-duration">FaceTime 영상 통화 · 00:00</div></div>
  <div class="ft-pip" id="ft-yeonghyeon-pip" aria-label="강영현 영상. 드래그해서 이동할 수 있습니다">
    <video id="ft-yeonghyeon-video" muted playsinline webkit-playsinline loop preload="metadata"></video>
    <span class="ft-pip-label">나</span><div id="ft-camera-off" hidden>카메라 꺼짐</div>
  </div>
  <div class="ft-call-controls" aria-label="영상 통화 조작">

const pip=$('ft-yeonghyeon-pip');
let drag=null;
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
function movePip(left,top){
  const margin=10;
  const maxX=Math.max(margin,screen.clientWidth-pip.offsetWidth-margin);
  const maxY=Math.max(margin,screen.clientHeight-pip.offsetHeight-margin);
  pip.style.left=clamp(left,margin,maxX)+'px';
  pip.style.top=clamp(top,margin,maxY)+'px';
  pip.style.right='auto';
}
function resetPipPosition(){
  pip.style.left='';pip.style.top='';pip.style.right='15px';

}

  if(mode!=='active'||event.isPrimary===false)return;
  event.preventDefault();
  const rect=pip.getBoundingClientRect(),outer=screen.getBoundingClientRect();
  drag={pointerId:event.pointerId,dx:event.clientX-rect.left,dy:event.clientY-rect.top};
  pip.classList.add('dragging');
  try{pip.setPointerCapture(event.pointerId)}catch(_){}
});
pip.addEventListener('pointermove',event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  const outer=screen.getBoundingClientRect();
  movePip(event.clientX-outer.left-drag.dx,event.clientY-outer.top-drag.dy);
});
function finishDrag(event){
  if(!drag||event.pointerId!==drag.pointerId)return;
  drag=null;pip.classList.remove('dragging');
  try{pip.releasePointerCapture(event.pointerId)}catch(_){}
}

ring.src=FACE_TIME.ringtone;ring.preload='auto';ring.load();
let soundsPrimed=false;
function silentPrime(el,volume){
  try{
    el.muted=false;el.volume=.001;

      if(el===ring && mode==='ringing')return;

function listBody(){const q=search.trim().toLowerCase();const rows=order().filter(t=>!q||`${t.name} ${t.subtitle||''} ${t.preview||''} ${t.messages.map(m=>m.text).join(' ')}`.toLowerCase().includes(q));return `<div class="shell">${rows.length?rows.map(t=>`<${t.disabled?'div':'button'} class="thread${t.disabled?' thread-inactive':''}"${t.disabled?'':` data-chat="${esc(t.id)}"`}>${avatar(t)}<span class="thread-body"><span class="thread-head"><span class="thread-name">${esc(t.name)}</span><span class="thread-date">${listDate(last(t).at)}</span></span><span class="thread-preview">${esc((t.preview||last(t).text).replace(/\s+/g,' ').slice(0,135))}</span></span></${t.disabled?'div':'button'}>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}</div>`}
function chatHead(t){return `<div class="chat-head shell"><button class="back-btn" type="button" id="back" aria-label="뒤로 가기">${svg('back')}</button><div class="contact-head">${avatar(t)}<span class="contact-name">${esc(t.name)}</span></div>${t.id==='dw'?`<button type="button" class="video-icon" id="dw-facetime-replay" aria-label="윤도운이 FaceTime 영상 통화 다시 걸기" title="FaceTime 영상 통화">${svg('video')}</button>`:`<span class="video-icon" aria-hidden="true">${svg('video')}</span>`}</div>`}
function chatBody(t){const sorted=t.messages.slice().sort((a,b)=>a.at.localeCompare(b.at));let prevDay='';return `<div class="message-list shell"><div class="secure-label">${t.kind==='imessage'?`iMessage<br>${svg('lock')} 암호화됨`:'문자 메시지 · SMS'}</div>${sorted.map(m=>{const day=m.at.slice(0,10);const mark=day!==prevDay?`<div class="day-divider">${esc(dayDate(m.at))}</div>`:'';prevDay=day;return mark+`<div class="bubble-row ${m.from==='me'?'me '+(t.kind==='sms'?'sms':''):'them'}"><div class="bubble">${esc(m.text)}</div></div>`}).join('')}${sorted.length&&sorted[sorted.length-1].from==='me'?'<div class="delivered">전송됨</div>':''}</div>`}
function composer(t){const draft=drafts[t.id]||'';return `<form class="chat-bottom shell" id="send-form"><span class="plus-button" aria-hidden="true">${svg('plus')}</span><span class="input-wrap"><textarea class="chat-input" id="chat-input" rows="1" aria-label="메시지 작성" placeholder="${t.kind==='sms'?'문자 메시지':'iMessage'}">${esc(draft)}</textarea></span><button type="submit" id="send" class="action-button${draft.trim()?' sending':''}" ${draft.trim()?'':'disabled'} aria-label="전송">${svg(draft.trim()?'send':'mic')}</button></form>`}
function stopScriptPlayback(){
  if(activeId==='dw'&&$('chat-input')?.readOnly)drafts.dw='';
  dwPlaybackToken++;
  dwTypingVisible=false;
  const keyboard=$('script-keyboard');if(keyboard)keyboard.remove();
  const footer=$('footer');footer.classList.remove('is-playing');
  const input=$('chat-input');if(input){input.readOnly=false;input.value='';}
  const typing=$('script-typing');if(typing)typing.remove();
}
/* 화면에 보이는 한글 2벌식 배열: 키 이름을 직접 보관해서 정확한 자판을 눌러줍니다. */
function scriptKeyboardRows(layout='hangul'){
 const key=(letter,cls='')=>`<span class="script-key ${cls}" data-key="${esc(letter)}">${esc(letter)}</span>`;
 const row=keys=>`<div class="script-key-row">${keys.map(k=>Array.isArray(k)?key(k[0],k[1]):key(k)).join('')}</div>`;
 if(layout==='symbols'){
  return row(['1','2','3','4','5','6','7','8','9','0'])+
    row(['-','/',':',';','(',')','₩','&','@','"'])+
    row([['#+=','special small'],'.',',','?','!','\'',['⌫','special']])+
    row([['가나다','special small'],['😀','special small emoji-key'],['간격','space'],['완료','return']]);
 }
 return row(['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'])+
   row(['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'])+
   row([['⇧','special'],'ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ',['⌫','special']])+
   row([['123','special small'],['😀','special small emoji-key'],['간격','space'],['완료','return']]);
}
function keyboardMarkup(){return `<div class="script-keyboard" id="script-keyboard" data-layout="hangul" aria-hidden="true">${scriptKeyboardRows('hangul')}</div>`}
function keyboardLayout(layout){
 const kb=$('script-keyboard');if(!kb||kb.dataset.layout===layout)return;
 kb.innerHTML=scriptKeyboardRows(layout);kb.dataset.layout=layout;
}
function pressedKey(key,shift=false){
 const kb=$('script-keyboard');if(!kb)return;
 kb.querySelectorAll('.is-pressed').forEach(el=>el.classList.remove('is-pressed'));
 for(const el of kb.querySelectorAll('.script-key'))if(el.dataset.key===key||(shift&&el.dataset.key==='⇧'))el.classList.add('is-pressed');
}
function releasePressedKeys(){
 $('script-keyboard')?.querySelectorAll('.is-pressed').forEach(el=>el.classList.remove('is-pressed'));
}
/* 유니코드 한글 음절을 2벌식 자모 키로 분해하여, 조합 중인 글자까지 보여줍니다. */
const K_CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const K_JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const K_JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const VOWEL_PARTS={'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']};
const FINAL_PARTS={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
const SHIFT_KEYS={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ','ㅒ':'ㅐ','ㅖ':'ㅔ'};
function keyStrokeEvents(text){
 const strokes=[];let complete='';
 for(const c of Array.from(text)){
  const code=c.codePointAt(0);
  if(code<0xac00||code>0xd7a3){
   strokes.push({key:c===' '?'간격':c,result:complete+c,punctuation:/[!?.,]/.test(c)});
   complete+=c;continue;
  }
  const syllable=code-0xac00,ci=Math.floor(syllable/588),vi=Math.floor((syllable%588)/28),fi=syllable%28;
  const cho=K_CHO[ci],vowel=K_JUNG[vi],final=K_JONG[fi];
  const strokeOf=(k,result)=>({key:SHIFT_KEYS[k]||k,shift:!!SHIFT_KEYS[k],result});
  strokes.push(strokeOf(cho,complete+cho));
  const vparts=VOWEL_PARTS[vowel]||[vowel];
  vparts.forEach((part,j)=>{
   const partialV=vparts.length===2&&j===0?part:vowel;
   const pvi=K_JUNG.indexOf(partialV);
   strokes.push(strokeOf(part,complete+String.fromCharCode(0xac00+(ci*21+pvi)*28)));
  });
  if(final){
   const fparts=FINAL_PARTS[final]||[final];
   fparts.forEach((part,j)=>{
    const partialF=fparts.length===2&&j===0?part:final;
    const pfi=K_JONG.indexOf(partialF);
    strokes.push(strokeOf(part,complete+String.fromCharCode(0xac00+(ci*21+vi)*28+pfi)));
   });
  }
  complete+=c;
  strokes[strokes.length-1].endSyllable=true;
 }
 return strokes;
}
async function typeScriptText(text,token){
 const valid=()=>token===dwPlaybackToken&&activeId==='dw';
 let input=$('chat-input');if(!input)return false;
 for(const step of keyStrokeEvents(text)){
  if(!valid())return false;
  input=$('chat-input');if(!input)return false;
  const needSymbols=!!step.punctuation;
  const kb=$('script-keyboard');
  if(kb&&kb.dataset.layout!==(needSymbols?'symbols':'hangul')){
   const switchKey=needSymbols?'123':'가나다';
   pressedKey(switchKey);await scriptWait(64);if(!valid())return false;
   keyboardLayout(needSymbols?'symbols':'hangul');
  }
  pressedKey(step.key,step.shift);
  input.value=step.result;inputState();scrollBottom();
  // 한글 음절 전체를 한번에 붙이지 않고 실제 자모 키마다 조합되게 표현.
  const duration=step.key==='간격'?100:step.punctuation?110:step.endSyllable?83:59;
  await scriptWait(duration);if(!valid())return false;
  releasePressedKeys();
  if(step.endSyllable||step.key==='간격')await scriptWait(step.key==='간격'?35:12);
 }
 return valid();
}
function scriptKeyboard(show){
 const footer=$('footer');const input=$('chat-input');if(!input)return;
 if(show&&!dwTypingVisible){footer.insertAdjacentHTML('beforeend',keyboardMarkup());footer.classList.add('is-playing');dwTypingVisible=true;scrollBottom()}
 if(!show&&dwTypingVisible){$('script-keyboard')?.remove();footer.classList.remove('is-playing');dwTypingVisible=false;input.value='';inputState();scrollBottom()}
}
function scriptAppend(from,text){
 const t=chats.find(x=>x.id==='dw');if(!t)return;
 const lastTime=21*60+29+dwPlaybackIndex;
 const time=`2027-08-20T${String(Math.floor(lastTime/60)).padStart(2,'0')}:${String(lastTime%60).padStart(2,'0')}:00`;
 t.messages.push({at:time,from,text});
 const list=$('content').querySelector('.message-list');
 if(!list||activeId!=='dw')return;
 list.querySelector('.delivered')?.remove();
 const row=document.createElement('div');row.className='bubble-row '+from;
 const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
 row.appendChild(bubble);list.appendChild(row);
 scrollBottom();
}

/* 사용자 동작으로 오디오 재생을 미리 허용하도록 준비합니다. */
function prepareFaceTimeAudio(){window.primeMessageSounds?.()}
function queueFaceTime(){
 if(ftQueued || ftStartTimer || activeId!=='dw' || dwPlaybackIndex < DOWOON_LIVE_SCRIPT.length)return;
 ftStartTimer=setTimeout(()=>{
   ftStartTimer=null;
   if(activeId==='dw' && !ftQueued){ftQueued=true;window.showFaceTimeIncoming?.()}
 },1200);
}
const scriptWait=ms=>new Promise(done=>setTimeout(done,ms));
async function runDowoonSequence(){
 if(activeId!=='dw'||dwPlaybackIndex>=DOWOON_LIVE_SCRIPT.length)return;
 const token=++dwPlaybackToken;
 const valid=()=>token===dwPlaybackToken&&activeId==='dw';
 let input=$('chat-input');if(input)input.readOnly=true;
 await scriptWait(380);
 while(valid()&&dwPlaybackIndex<DOWOON_LIVE_SCRIPT.length){
  const msg=DOWOON_LIVE_SCRIPT[dwPlaybackIndex];
  if(msg.from==='me'){
   scriptKeyboard(true);
   input=$('chat-input');if(!input)return;
   input.value='';inputState();
   await scriptWait(140);if(!valid())return;
   // 실제 한글 키 배열과 일치하는 자모를 누르며 글자가 점차 완성됩니다.
   if(!await typeScriptText(msg.text,token))return;
   await scriptWait(150);if(!valid())return;
   scriptAppend('me',msg.text);
   input.value='';inputState();
   dwPlaybackIndex++;
   if(DOWOON_LIVE_SCRIPT[dwPlaybackIndex]?.from!=='me')scriptKeyboard(false);
   await scriptWait(380);
  }else{
   scriptKeyboard(false);
   const list=$('content').querySelector('.message-list');
   if(!list)return;
   const typing=document.createElement('div');typing.id='script-typing';typing.className='script-typing';
   typing.setAttribute('aria-label','윤도운이 입력 중');typing.innerHTML='<i></i><i></i><i></i>';
   list.appendChild(typing);scrollBottom();
   await scriptWait(Math.max(610,Math.min(1280,480+msg.text.length*33)));
   typing.remove();if(!valid())return;
   scriptAppend('them',msg.text);
   dwPlaybackIndex++;
   await scriptWait(Math.max(590,Math.min(1350,560+msg.text.length*22)));
  }
 }
 if(valid()){
  scriptKeyboard(false);
  const input=$('chat-input');if(input){input.readOnly=false;input.value='';inputState()}
  queueFaceTime();
 }
}
/* FaceTime 수신을 직접 거절했을 때만, 기존 연출에 이어 세 문장을 한 번 표시합니다. */
const DOWOON_DECLINE_MESSAGES=[
 {from:'them',text:'2분 지났어'},
 {from:'me',text:'아 안 될 것 같다 이따 하자'},
 {from:'them',text:'치사해'}
];
let declineMessagesPlayed=false;
async function playDeclineMessages(){
 if(declineMessagesPlayed||activeId!=='dw')return;
 declineMessagesPlayed=true;
 const token=++dwPlaybackToken;
 const valid=()=>token===dwPlaybackToken&&activeId==='dw';
 let input=$('chat-input');if(input)input.readOnly=true;
 await scriptWait(380);
 for(const msg of DOWOON_DECLINE_MESSAGES){
  if(!valid())return;
  if(msg.from==='me'){
   scriptKeyboard(true);
   input=$('chat-input');if(!input)return;
   input.value='';inputState();
   await scriptWait(140);if(!valid())return;
   if(!await typeScriptText(msg.text,token))return;
   await scriptWait(150);if(!valid())return;
   scriptAppend('me',msg.text);
   input.value='';inputState();
   dwPlaybackIndex++;
   scriptKeyboard(false);
   await scriptWait(380);
  }else{
   scriptKeyboard(false);
   const list=$('content').querySelector('.message-list');if(!list)return;
   const typing=document.createElement('div');typing.id='script-typing';typing.className='script-typing';
   typing.setAttribute('aria-label','윤도운이 입력 중');typing.innerHTML='<i></i><i></i><i></i>';
   list.appendChild(typing);scrollBottom();
   await scriptWait(Math.max(610,Math.min(1280,480+msg.text.length*33)));
   typing.remove();if(!valid())return;
   scriptAppend('them',msg.text);
   dwPlaybackIndex++;
   await scriptWait(Math.max(590,Math.min(1350,560+msg.text.length*22)));
  }
 }
 if(valid()){
  scriptKeyboard(false);
  input=$('chat-input');if(input){input.readOnly=false;input.value='';inputState()}
 }
}
$('ft-decline').addEventListener('click',playDeclineMessages);
window.addEventListener('pageshow',e=>{if(e.persisted)declineMessagesPlayed=false});
function showList(){clearTimeout(ftStartTimer);ftStartTimer=null;window.resetEmbeddedFaceTime?.();stopScriptPlayback();activeId=null;$('header').innerHTML=listHead();$('content').innerHTML=listBody();$('content').scrollTop=listScroll;$('footer').hidden=true;$('footer').innerHTML=''}
function showChat(id){const t=chats.find(t=>t.id===id);if(!t||t.disabled)return;if(activeId!==id)stopScriptPlayback();if(activeId===null)listScroll=$('content').scrollTop;activeId=id;$('header').innerHTML=chatHead(t);$('content').innerHTML=chatBody(t);$('footer').hidden=false;$('footer').innerHTML=composer(t);fitInput();scrollBottom();if(id==='dw'&&dwPlaybackIndex<DOWOON_LIVE_SCRIPT.length)runDowoonSequence();else if(id==='dw')queueFaceTime()}
function scrollBottom(){requestAnimationFrame(()=>{if(activeId!==null)$('content').scrollTop=$('content').scrollHeight})}
function fitInput(){const e=$('chat-input');if(!e)return;e.style.height='26px';e.style.height=Math.min(105,Math.max(26,e.scrollHeight))+'px'}
function inputState(){const input=$('chat-input'),b=$('send');if(!input||!b)return;drafts[activeId]=input.value;b.disabled=!input.value.trim();b.classList.toggle('sending',!!input.value.trim());b.innerHTML=svg(input.value.trim()?'send':'mic');fitInput()}
function simulatedTime(){const minute=nextClock++;return `${today}T${String(Math.floor(minute/60)%24).padStart(2,'0')}:${String(minute%60).padStart(2,'0')}:00`}
function send(){const t=chats.find(t=>t.id===activeId),input=$('chat-input');if(!t||!input||input.readOnly||!input.value.trim())return;const message=input.value.trim();t.messages.push({at:simulatedTime(),from:'me',text:message});drafts[t.id]='';showChat(t.id);}
document.addEventListener('click',e=>{
 if(e.target.closest('#dw-facetime-replay')){
   if(activeId!=='dw')return;
   // 사용자가 직접 누를 때마다 같은 FaceTime 수신 화면을 처음부터 다시 시작.
   clearTimeout(ftStartTimer);ftStartTimer=null;ftQueued=true;
   stopScriptPlayback();
   prepareFaceTimeAudio();
   window.showFaceTimeIncoming?.();
   return;
 }
 if(e.target.closest('#clear-search')){search='';const input=$('search');if(input)input.value='';$('clear-search').hidden=true;$('content').innerHTML=listBody();$('content').scrollTop=0;input?.focus();return}const row=e.target.closest('[data-chat]');if(row){if(row.dataset.chat==='dw')prepareFaceTimeAudio();showChat(row.dataset.chat);return}if(e.target.closest('#back'))showList()});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('clear-search').hidden=!search;$('content').innerHTML=listBody();$('content').scrollTop=0;listScroll=0}else if(e.target.id==='chat-input')inputState()});
document.addEventListener('submit',e=>{if(e.target.id==='send-form'){e.preventDefault();send()}});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}else if(e.key==='Escape'&&activeId!==null)showList()});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(activeId!==null)scrollBottom()});
// 브라우저 뒤로/앞으로 캐시 복귀에도 새 접속과 동일하게 초기화합니다.
window.addEventListener('pageshow',e=>{if(!e.persisted)return;stopScriptPlayback();chats.splice(0,chats.length,...JSON.parse(JSON.stringify(SEED_CHATS)));drafts={};dwPlaybackIndex=0;ftQueued=false;window.resetEmbeddedFaceTime?.();listScroll=0;nextClock=14*60+31;search='';showList()});
window.addEventListener('pagehide',()=>window.resetEmbeddedFaceTime?.());
showList();
})();
</script>
