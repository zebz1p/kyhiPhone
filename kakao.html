const opener=document.getElementById('profile-call');
const end=document.getElementById('vt-end');
const app=document.querySelector('.kakao-app-wrapper');
// 같은 오디오 요소를 재사용해 모바일의 사용자 재생 허용을 이어갑니다.
const audio=new Audio();audio.preload='auto';audio.setAttribute('playsinline','');
const ringUrl='https://zebz1p.dothome.co.kr/public/uploads/voicetalk.mp3?_t=1792601361';
const voiceUrl='https://zebz1p.dothome.co.kr/public/uploads/call.m4a?_t=1792600963';
let phase='idle',session=0,connectTimer=null,clockTimer=null;
function clearTimers(){clearTimeout(connectTimer);clearInterval(clockTimer);connectTimer=null;clockTimer=null;}
function stop(focus=true){
 ++session;phase='idle';clearTimers();audio.pause();audio.removeAttribute('src');audio.load();
 screen.hidden=true;retry.hidden=true;app.inert=false;
 if(focus)opener.focus({preventScroll:true});
}
function showPlaybackError(){
 if(phase==='idle')return;
 clearTimers();audio.pause();status.textContent='음성을 재생할 수 없습니다.';retry.hidden=false;
}
function play(){
 const token=session;retry.hidden=true;
 const promise=audio.play();
 if(promise)promise.catch(()=>{if(token===session&&phase!=='idle')showPlaybackError();});
}
function connect(){
 if(phase!=='ring')return;
 connectTimer=null;phase='voice';audio.pause();audio.loop=false;audio.volume=.85;
 audio.src=voiceUrl;status.textContent='음성 연결 중...';play();
}
function updateClock(){
 const seconds=Math.floor(audio.currentTime||0);
 status.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
}
audio.addEventListener('playing',()=>{
 if(phase==='ring'){
  status.textContent='연결 중...';
  // 실제 연결음이 재생되기 시작한 시점부터 5초.
  if(connectTimer===null)connectTimer=setTimeout(connect,5000);
 }else if(phase==='voice'){
  updateClock();if(clockTimer===null)clockTimer=setInterval(updateClock,250);
 }
});
audio.addEventListener('ended',()=>{if(phase==='voice')stop();});
audio.addEventListener('error',showPlaybackError);
opener.addEventListener('click',()=>{
 if(phase!=='idle')return;
 ++session;phase='ring';screen.hidden=false;app.inert=true;retry.hidden=true;
 status.textContent='연결 중...';end.focus({preventScroll:true});
 audio.loop=true;audio.volume=.55;audio.src=ringUrl;play();
});
end.addEventListener('click',()=>stop());
retry.addEventListener('click',()=>{if(phase!=='idle'){audio.load();play();}});
screen.addEventListener('keydown',event=>{
 if(event.key==='Escape'){event.preventDefault();stop();}
 if(event.key==='Tab'){
  const buttons=retry.hidden?[end]:[retry,end];const i=buttons.indexOf(document.activeElement);
  event.preventDefault();buttons[(i+(event.shiftKey?-1:1)+buttons.length)%buttons.length].focus();
 }
});
window.addEventListener('pagehide',()=>stop(false));
})();
</script>
</body>
</html>
