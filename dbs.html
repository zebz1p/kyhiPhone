  "main:post:9006:::text:4": "[보안 협조 요청]\n\n대외비 자료, 미공개 편성표, 출연자 개인정보를 개인 메일이나 외부 클라우드로 옮기지 말아 주세요. 외부 협력사 전달이 필요한 문서는 팀 책임자 승인 후 지정 공유 폴더를 사용해 주시기 바랍니다.\n\n의심스러운 메일이나 링크를 열었다면 즉시 정보시스템팀으로 연락해 주세요.\n\n사고 예방에 협조 부탁드립니다.\n정보시스템팀",

function go(v,a=null,push=true){if(view==='room')drafts[arg]=$('message-input').value;if(push)routeStack.push([view,arg]);view=v;arg=a;render();$('main').scrollTop=0;if(v==='room'){$('message-input').value=drafts[a]||'';$('main').scrollTop=$('main').scrollHeight}}
function back(){const prev=routeStack.pop()||['home',null];go(prev[0],prev[1],false)}
const head=(title,sub='')=>`<div class="eyebrow">DBS WORKPLACE</div><h1 class="heading">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}`;
const backHead=title=>`<div class="back-title"><button data-action="back" aria-label="뒤로">${icon('back')}</button><h1>${esc(title)}</h1></div>`;
const section=(name,target)=>`<div class="section-head"><h2>${name}</h2><button class="text-link" data-go="${target}">전체보기 ${icon('arrow')}</button></div>`;
function menuCard(){const dinner=mealTab==='저녁';return `<div class="card menu-card"><div class="menu-top"><span class="pill green">${dinner?'DINNER':'LUNCH'}</span>${icon('food')}</div><h2 class="menu-title">${esc(dinner?meal.dinner:meal.main)}</h2><p class="menu-items">${(dinner?meal.dinnerItems:meal.items).map(esc).join('<br>')}</p><div class="menu-footer"><span>${esc(meal.place)}</span><span>${esc(dinner?meal.dinnerHours:meal.hours)}</span></div></div>`}
function noticeList(){return `<div class="card">${notices.map((n,i)=>`<button class="row" data-go="notice" data-arg="${i}"><div class="grow"><div class="small">${esc(n.department||'DBS 운영팀')} · ${esc(n.author||'OO')} · ${esc(n.time)}</div><div class="row-title">${n.title}</div></div>${icon('arrow','arrow')}</button>`).join('')}</div>`}
function home(){mealTab='점심';return `${head('좋은 하루예요, 영현 님.','오늘도 새로운 이야기가 시작되는 곳.')}<div class="hero"><div class="hero-mark">DBS</div><div class="eyebrow">WE MAKE THE NEXT</div><h2>좋은 이야기는<br>우리 안에서 시작됩니다.</h2><p>DBS 방송국 임직원을 위한 업무 공간</p><button class="hero-foot" style="width:100%;color:white" data-go="id"><span>${employee.team} · ${employee.role} 강영현</span>${icon('arrow')}</button></div><div class="quick">${[['id','id','사원증'],['meal','food','오늘의 메뉴'],['apply','leave','연차 신청'],['board','board','익명게시판']].map(([v,i,t])=>`<button data-go="${v}">${icon(i)}<span>${t}</span></button>`).join('')}</div>${section('오늘의 메뉴','meal')}${menuCard()}${section('DBS 소식','notices')}${noticeList()}${section('업무 체크','work')}<button class="card row" data-go="work"><span class="avatar green">${icon('work')}</span><div class="grow"><div class="row-title">나의 신청 현황</div><p class="small">접수한 신청 ${requests.length}건을 확인하세요.</p></div>${icon('arrow','arrow')}</button>`}
function chatList(){return `${head('채팅','함께 만드는 방송, 더 가까운 소통.')}<div class="section-head"><h2>내 대화</h2><span class="pill green">온라인</span></div><div class="card">${chats.map((c,i)=>{const m=c.messages.at(-1);return `<button class="row" data-go="room" data-arg="${i}"><div class="avatar ${i%2?'green':''}">${esc(c.label)}</div><div class="grow"><div class="row-title">${esc(c.name)}</div><div class="preview">${esc(m?.text||'대화를 시작해 보세요')}</div></div><span class="timestamp">${esc(m?.time||'')}</span></button>`}).join('')}</div>`}
function room(){const c=chats[arg];return `${backHead(c.name)}<div class="eyebrow" style="text-align:center;margin-bottom:25px">${esc(c.members)}</div><div class="conversation">${c.messages.map(m=>`<div class="message ${m.name==='나'?'me':''}">${m.name!=='나'?`<div class="avatar">${esc(m.name.slice(0,2))}</div>`:''}<div class="message-body">${m.name!=='나'?`<div class="message-name">${esc(m.name)}</div>`:''}<div class="bubble">${esc(m.text)}</div><p class="small">${esc(m.time)}</p></div></div>`).join('')}</div>`}
function work(){return `${head('업무','필요한 신청과 내 업무를 한곳에서.')}<div class="grid2" style="margin-top:20px"><div class="card stat"><p class="small">잔여 연차</p><strong>5<small>일</small></strong></div><div class="card stat"><p class="small">진행 중 신청</p><strong style="color:var(--blue)">${requests.length}<small>건</small></strong></div></div><div class="section-head"><h2>새로운 신청</h2></div><div class="card">${['연차 신청','장비 신청','회의실 예약','증명서 발급'].map((t,i)=>`<button class="row" data-go="apply" data-arg="${i}"><span class="avatar ${i%2?'green':''}">${icon(i===0?'leave':'work')}</span><span class="grow row-title">${t}</span>${icon('arrow','arrow')}</button>`).join('')}</div><div class="section-head"><h2>나의 신청 내역</h2><span class="small">${requests.length}건</span></div><div class="card">${requests.length?requests.map((r,i)=>`<button class="row" data-go="request" data-arg="${i}"><span class="pill ${r.status==='승인'?'green':''}">${esc(r.status||'검토 대기')}</span><div class="grow"><div class="row-title">${esc(r.type)}</div><div class="small">${esc(r.reason||r.start)}${!r.reason&&r.end&&r.end!==r.start?' — '+esc(r.end):''}</div></div>${icon('arrow','arrow')}</button>`).join(''):'<div class="empty">아직 신청한 내역이 없습니다.</div>'}</div>`}
function apply(){return `${backHead('업무 신청')}<form class="card form" id="request-form"><label class="field"><span>신청 유형</span><select name="type">${['연차 신청','장비 신청','회의실 예약','증명서 발급'].map((t,i)=>`<option ${i===Number(arg)?'selected':''}>${t}</option>`).join('')}</select></label><div class="grid2"><label class="field"><span>시작일 / 필요일</span><input name="start" type="date" required></label><label class="field"><span>종료일</span><input name="end" type="date"></label></div><label class="field"><span>신청 내용</span><textarea name="reason" required maxlength="2000" placeholder="사유, 외근 장소 또는 필요한 증명서 종류를 적어주세요."></textarea></label><div class="detail" style="margin-bottom:20px"><span>신청자</span><strong>강영현 · ${employee.team}</strong></div><button class="primary">신청하기</button></form><p class="muted-note">이 앱 안에 신청 내역이 저장됩니다.</p>`}
const boardAuthor=p=>p.department?`${p.department} · ${p.author||'OO'}`:(p.author||'익명');
function board(){const list=posts.filter(p=>filter==='전체'||p.category===filter).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||String(b.date||'').localeCompare(String(a.date||'')));return `${head('익명게시판','이름 없이, 조금 더 솔직한 이야기.')}<div class="section-head"><span class="small">서로를 존중하는 DBS의 대화</span><button class="text-link" style="color:var(--blue)" data-go="write">${icon('plus')} 글쓰기</button></div><div class="tabs">${['전체','공지','회사생활','자유'].map(t=>`<button class="${filter===t?'selected':''}" data-filter="${t}">${t}</button>`).join('')}</div><div class="card">${list.map(p=>`<button class="post" data-go="post" data-arg="${p.id}">${p.pinned?'<span class="pill green">고정</span> ':''}<span class="pill gray">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.body.slice(0,75))}${p.body.length>75?'…':''}</p><div class="post-meta"><span>${esc(boardAuthor(p))} · ${esc(p.time)}</span><span>공감 ${p.likes}</span><span>댓글 ${p.comments.length}</span></div></button>`).join('')||'<div class="empty">아직 게시글이 없습니다.</div>'}</div>`}
function post(){const p=posts.find(p=>p.id===Number(arg));return `${backHead('익명게시판')}<article class="card article">${p.pinned?'<span class="pill green">고정</span> ':''}<span class="pill gray">${esc(p.category)}</span><h2>${esc(p.title)}</h2><p class="small">${esc(boardAuthor(p))} · ${esc(p.time)}</p><div class="article-content">${esc(p.body)}</div><button class="secondary" data-like="${p.id}">${liked.includes(p.id)?'공감했어요':'공감해요'} · ${p.likes}</button></article><div class="section-head"><h2>댓글 ${p.comments.length}</h2></div><div class="card">${p.comments.map((c,i)=>`<div class="row"><div class="grow"><div class="small">익명 ${i+1}</div><p class="notice-text">${esc(c)}</p></div></div>`).join('')||'<div class="empty">첫 댓글을 남겨보세요.</div>'}</div><form id="comment-form" style="margin-top:14px"><label class="field"><textarea name="comment" required maxlength="1000" placeholder="익명으로 댓글 남기기" aria-label="댓글"></textarea></label><button class="primary">댓글 등록</button></form>`}
function write(){return `${backHead('익명 글쓰기')}<form id="post-form" class="card form"><label class="field"><span>게시판</span><select name="category"><option>회사생활</option><option>자유</option></select></label><label class="field"><span>제목</span><input name="title" maxlength="80" required placeholder="제목을 입력하세요"></label><label class="field"><span>내용</span><textarea name="body" maxlength="5000" required placeholder="나누고 싶은 이야기를 적어주세요." style="min-height:200px"></textarea></label><button class="primary">익명으로 등록</button></form>`}
function barcode(value){const patterns={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','*':'nwnnwnwnn'};let x=12,rects='';for(const c of '*'+value+'*'){patterns[c].split('').forEach((w,i)=>{const width=w==='w'?3:1;if(i%2===0)rects+=`<rect x="${x}" y="0" width="${width}" height="60"/>`;x+=width});x+=1}return `<svg viewBox="0 0 ${x+12} 60" preserveAspectRatio="none" role="img" aria-label="사번 ${value} 바코드">${rects}</svg>`}
function id(){return `${head('모바일 사원증','DBS의 이야기를 만드는 사람.')}<div class="id-card"><div class="id-band"><b>DBS.</b><span>EMPLOYEE PASS</span></div><div class="id-content"><div style="display:flex;justify-content:space-between;align-items:start"><div class="id-avatar">${icon('user')}</div><span class="pill green">재직 중</span></div><h2 class="id-name">${employee.name}</h2><p class="id-role">${employee.team} · ${employee.role}</p><div class="detail"><span>사번</span><strong>${employee.number}</strong></div><div class="detail"><span>이메일</span><strong>${employee.email}</strong></div><div class="barcode">${barcode(employee.number)}<p>${employee.number}</p></div></div><div class="id-bottom" aria-label="DBS"><div class="id-marquee">${Array.from({length:2},()=>`<div class="id-marquee-set" aria-hidden="true">${Array.from({length:8},()=>'<span class="id-marquee-dot"></span><span class="id-marquee-word">DBS</span>').join('')}</div>`).join('')}</div></div></div>`}

function mailToDisplay(to){
 const value=String(to||'');
 if(/<[^>]+>/.test(value))return value;
 if(value.trim().toLowerCase()===String(employee.email).toLowerCase())return employee.name+' <'+value+'>';
 if(value.trim().toLowerCase()==='ydwdw@doke.com')return '윤도운 <'+value+'>';
 return value;
}
function mailList(){
 const folder=mails.filter(m=>(m.folder||'inbox')===mailFolder).sort((a,b)=>(mailFolder==='inbox'?Number(!!b.pinned)-Number(!!a.pinned):0)||String(b.date||'').localeCompare(String(a.date||'')));
 const unread=mails.filter(m=>(m.folder||'inbox')==='inbox'&&!m.read).length;
 return `${head('메일함')}<div class="section-head" style="margin-top:18px"><span class="small">${unread?`읽지 않은 메일 ${unread}개`:'새 메일이 없습니다.'}</span><button class="text-link" style="color:var(--blue)" data-go="composemail">${icon('plus')} 메일 쓰기</button></div><div class="dbs-mail-folders"><button class="${mailFolder==='inbox'?'selected':''}" data-mail-folder="inbox">받은메일</button><button class="${mailFolder==='sent'?'selected':''}" data-mail-folder="sent">보낸메일</button></div><div class="card">${folder.map(m=>`<div class="dbs-mail-row ${m.read?'':'is-unread'}"><button data-go="maildetail" data-arg="${esc(m.id)}" class="grow" style="display:flex;gap:12px;align-items:flex-start;min-width:0"><span class="avatar ${m.read?'green':''}">${esc((m.folder==='sent'?'나':m.fromName||'메일').slice(0,2))}</span><span class="grow"><span class="dbs-mail-from" style="display:block">${esc(m.folder==='sent'?m.to:m.fromName)}</span><span class="dbs-mail-subject" style="display:block">${esc(m.subject)}</span><span class="dbs-mail-preview" style="display:block">${esc(m.body.replace(/\s+/g,' ').slice(0,90))}</span></span><span class="timestamp">${esc((m.date||'').slice(6))}</span></button><button aria-label="${m.starred?'중요 표시 해제':'중요 표시'}" class="dbs-mail-star ${m.starred?'is-starred':''}" data-mail-star="${esc(m.id)}">${m.starred?'★':'☆'}</button></div>`).join('')||'<div class="empty">메일이 없습니다.</div>'}</div>`;
}
function mailDetail(){
 const m=mails.find(x=>String(x.id)===String(arg));if(!m)return `${backHead('메일')}<div class="empty">메일을 찾을 수 없습니다.</div>`;
 if(!m.read){m.read=true;save();}
 return `${backHead('메일 보기')}<article class="card dbs-mail-article"><h2>${esc(m.subject)}</h2><div class="dbs-mail-meta">보낸 사람　${esc(m.fromName)} &lt;${esc(m.fromEmail)}&gt;<br>받는 사람　${esc(mailToDisplay(m.to))}<br>날짜　　　　${esc(m.date)}</div><div class="dbs-mail-body">${esc(m.body)}</div></article><div class="dbs-mail-cta"><button class="secondary" data-go="mail">목록으로</button><button class="secondary" data-mail-star="${esc(m.id)}">${m.starred?'★ 중요 해제':'☆ 중요 표시'}</button></div>`;
}
function composeMail(){return `${backHead('메일 쓰기')}<form class="card form" id="dbs-mail-compose-form"><label class="field"><span>받는 사람</span><input type="email" name="to" required autocomplete="off" placeholder="name@dbs.com"></label><label class="field"><span>제목</span><input name="subject" required maxlength="140" placeholder="메일 제목"></label><label class="field"><span>내용</span><textarea name="body" required maxlength="10000" placeholder="메일 내용을 작성하세요." style="min-height:240px"></textarea></label><button class="primary">보내기</button></form>`;}

function render(){let content='';if(view==='home')content=home();else if(view==='chat')content=chatList();else if(view==='room')content=room();else if(view==='work')content=work();else if(view==='apply')content=apply();else if(view==='board')content=board();else if(view==='post')content=post();else if(view==='write')content=write();else if(view==='id')content=id();else if(view==='mail')content=mailList();else if(view==='maildetail')content=mailDetail();else if(view==='composemail')content=composeMail();else if(view==='meal')content=`${backHead('오늘의 메뉴')}<p class="sub">따뜻한 한 끼, 잠깐의 쉼.</p><div class="tabs">${['점심','저녁'].map(t=>`<button data-meal="${t}" class="${mealTab===t?'selected':''}">${t}</button>`).join('')}</div>${menuCard()}<div class="card menu-card" style="margin-top:14px"><h3 style="font-size:14px">이용 안내</h3><p class="sub">사원증을 지참해 주세요.<br>알레르기 정보는 배식 담당자에게 문의해 주세요.</p></div>`;else if(view==='notices')content=`${backHead('DBS 소식')}${noticeList()}`;else if(view==='notice'){const n=notices[arg];content=`${backHead('DBS 소식')}<article class="card article"><span class="pill">${n.tag}</span><h2>${n.title}</h2><p class="small">${esc(n.department||'DBS 운영팀')} · ${esc(n.author||'OO')} · ${esc(n.time)}</p><div class="article-content">${esc(n.body)}</div></article>`}else if(view==='request'){const r=requests[arg];content=`${backHead('신청 상세')}<div class="card article"><span class="pill ${r.status==='승인'?'green':''}">${esc(r.status||'검토 대기')}</span><h2>${esc(r.type)}</h2><div class="detail"><span>신청자</span><strong>강영현 · ${employee.team}</strong></div><div class="detail"><span>신청 기간</span><strong>${esc(r.start)} ${r.end?'— '+esc(r.end):''}</strong></div><div class="article-content">${esc(r.reason)}</div><button class="secondary" data-cancel="${arg}">신청 취소</button></div>`}
$('main').innerHTML=content;$('composer').hidden=view!=='room';const active=['room'].includes(view)?'chat':['apply','request'].includes(view)?'work':['post','write'].includes(view)?'board':['meal','notices','notice','mail','maildetail','composemail'].includes(view)?'home':view;$('nav').innerHTML=[['home','홈'],['chat','채팅'],['work','업무'],['board','게시판'],['id','사원증']].map(([v,t])=>`<button data-go="${v}" class="${v===active?'active':''}" ${v===active?'aria-current="page"':''}>${icon(v)}<span>${t}</span></button>`).join('');applySavedText();updateMailBadge()}
function updateMailBadge(){const node=$('dbs-mail-button');if(node)node.innerHTML=icon('mail')+(mails.some(m=>(m.folder||'inbox')==='inbox'&&!m.read)?'<span class="dbs-mail-unread-dot"></span>':'');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go,b.dataset.arg??null);else if(b.dataset.action==='back')back();else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.meal){mealTab=b.dataset.meal;render()}else if(b.dataset.like){const id=Number(b.dataset.like),p=posts.find(p=>p.id===id);if(liked.includes(id)){liked=liked.filter(x=>x!==id);p.likes--}else{liked.push(id);p.likes++}save();render()}else if(b.dataset.mailFolder){mailFolder=b.dataset.mailFolder;render()}else if(b.dataset.mailStar!==undefined){const msg=mails.find(m=>String(m.id)===String(b.dataset.mailStar));if(msg){msg.starred=!msg.starred;save();render();}}else if(b.dataset.cancel!==undefined){requests.splice(Number(b.dataset.cancel),1);save();go('work');toast('신청을 취소했습니다.')}});
/* 메일 도착 배너: 발신자·제목만 표시, 누르면 해당 메일을 엽니다. */
let mailNoticeTimer=null,mailNoticeHideTimer=null,mailNoticeId=null;
function showMailNotification(mail){
 const notice=$('dbs-mail-notification');
 clearTimeout(mailNoticeTimer);clearTimeout(mailNoticeHideTimer);
 notice.querySelector('.dbs-notify-sender').textContent=mail.fromName;
 notice.querySelector('.dbs-notify-subject').textContent=mail.subject;
 mailNoticeId=mail.id;
 notice.hidden=false;
 // [hidden] 해제 후 CSS 전환이 실행되도록 처리
 requestAnimationFrame(()=>requestAnimationFrame(()=>notice.classList.add('show')));
 mailNoticeTimer=setTimeout(()=>{
   notice.classList.remove('show');
   mailNoticeHideTimer=setTimeout(()=>{if(!notice.classList.contains('show'))notice.hidden=true},250);
 },4800);
}
$('dbs-mail-notification').addEventListener('click',()=>{
 if(mailNoticeId===null)return;
 clearTimeout(mailNoticeTimer);clearTimeout(mailNoticeHideTimer);
 $('dbs-mail-notification').classList.remove('show');
 $('dbs-mail-notification').hidden=true;
 go('maildetail',mailNoticeId);
});
/* 윤도운의 자동 답장: 실제 메일 서버가 아닌 이 페이지 안에서만 생성됩니다. */
const DOWOON_MAIL='ydwdw@doke.com';
function chooseDowoonReply(subject,body){
 const content=String(subject||'')+'\n'+String(body||'');
 const hasLove=content.includes('사랑해');
 const hasMiss=/보고\s*싶(?:어|다)/.test(content);
 if(hasLove&&hasMiss)return Math.random()<.5?{subject:'나도',body:'사랑해 보고 싶어 죽겠다'}:{subject:'웬일이야?',body:'내가 더 보고 싶어'};
 if(hasLove)return {subject:'나도',body:'사랑해 보고 싶어 죽겠다'};
 if(hasMiss)return {subject:'웬일이야?',body:'내가 더 보고 싶어'};
 return {subject:'뭐고?',body:'내한테는 보내지 말라면서 지는 맨날 이거 쓴다 ㅡㅡ\n나 지금 원장쌤이랑 어디 가는 중\n일찍 끝나면 형 퇴근할 때 델러 갈게\n일 열심히 해라 사랑해~'};
}
function deliverDowoonReply(sent){
 const response=chooseDowoonReply(sent.subject,sent.body);
 const reply={id:'dowoon-'+sent.id,folder:'inbox',fromName:'윤도운',fromEmail:DOWOON_MAIL,
   to:employee.email,subject:response.subject,body:response.body,
   date:'2027. 08. 25. '+new Date().toTimeString().slice(0,5),read:false,starred:false};
 mails.unshift(reply);
 save();updateMailBadge();
 if(view==='mail'&&mailFolder==='inbox')render();
 showMailNotification(reply);
}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));if(f.id==='composer'){const text=$('message-input').value.trim();if(!text)return;const time=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());chats[arg].messages.push({name:'나',text,time});$('message-input').value='';drafts[arg]='';save();render();$('main').scrollTop=$('main').scrollHeight;$('message-input').focus()}else if(f.id==='request-form'){if(d.end&&d.end<d.start){toast('종료일은 시작일 이후로 선택해 주세요.');return}if(!d.reason.trim())return;requests.unshift(d);save();go('work');toast('신청이 접수되었습니다.')}else if(f.id==='post-form'){if(!d.title.trim()||!d.body.trim())return;const id=Date.now();posts.unshift({...d,id,time:'방금',date:'2027-08-25T23:59:00',likes:0,comments:[]});save();go('post',id);toast('익명으로 등록했습니다.')}else if(f.id==='comment-form'){if(!d.comment.trim())return;posts.find(p=>p.id===Number(arg)).comments.push(d.comment.trim());save();render();toast('댓글을 등록했습니다.')}else if(f.id==='dbs-mail-compose-form'){if(!d.to.trim()||!d.subject.trim()||!d.body.trim())return;const sent={id:Date.now(),folder:'sent',fromName:employee.name,fromEmail:employee.email,to:d.to.trim(),subject:d.subject.trim(),body:d.body.trim(),date:'2027. 08. 25. '+new Date().toTimeString().slice(0,5),read:true,starred:false};mails.unshift(sent);save();mailFolder='sent';go('mail');if(sent.to.toLowerCase()===DOWOON_MAIL)window.setTimeout(()=>deliverDowoonReply(sent),1600);}});

/* 기존에 저장된 화면 문구를 읽기 전용으로 표시합니다. */
function applySavedText(){
 const roots=[['header',$('app').querySelector('.top')],['main:'+view+':'+String(arg??'')+':'+(view==='board'?filter:'')+':'+(view==='meal'?mealTab:'')+(view==='mail'?'|'+mailFolder:''),$('main')],['nav',$('nav')]];
 for(const [scope,root] of roots){
  if(!root)continue;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()){
   const node=walker.currentNode;
   if(!node.textContent.trim()||!node.parentElement)continue;
   if(node.parentElement.closest('svg,script,style,textarea,option'))continue;
   nodes.push(node);
  }
  nodes.forEach((node,i)=>{
   const key=scope+':text:'+i;
   if(Object.prototype.hasOwnProperty.call(textOverrides,key))node.textContent=textOverrides[key];
  });
  [...root.querySelectorAll('input[placeholder],textarea[placeholder]')].forEach((el,i)=>{
   const key=scope+':placeholder:'+i;
   if(Object.prototype.hasOwnProperty.call(attrOverrides,key))el.setAttribute('placeholder',attrOverrides[key]);
  });
 }
}
$('bell').innerHTML=icon('bell')+'<span class="dot"></span>';$('user').innerHTML=icon('user');$('send').innerHTML=icon('send');render();
})();
</script></body></html>
