/* 화면 가득 사용하며, 상단/하단 고정 · 본문만 스크롤 */
html,body,#app{width:100%;max-width:100%;height:100%;height:100dvh;overflow:hidden}
.top-wrap{padding-top:env(safe-area-inset-top,0px)}
.shell{width:100%;max-width:680px;margin:0 auto}
#content{width:100%;height:100%;min-height:0;flex:1;overscroll-behavior:contain;overflow-x:hidden;overflow-y:auto}
.call-list{width:100%;max-width:680px;margin:0 auto;padding-top:3px;padding-bottom:32px}
.record-detail{width:100%;max-width:680px;margin:0 auto}
.head-main{height:113px;padding:8px 20px 14px}
.header-large{font-size:34px}
.back-button{padding:9px 3px;font-weight:560}
.muted-control{font-size:16px;color:#A1A1A7;cursor:default;user-select:none}
.call-caption{gap:0}
.call-row{gap:12px;min-width:0}
.call-row-body{min-width:0}
.call-row-right{gap:8px}

.detail-action:disabled{opacity:1;cursor:default}
.detail-action:disabled:active{background:#fff}
.footer .tab:disabled{opacity:1;cursor:default}
.footer .tab:disabled:active{background:transparent}
.call-overlay[hidden],.dialog-note[hidden]{display:none!important}
@media(max-width:350px){.call-row{padding-left:13px;padding-right:13px;gap:10px}.avatar{width:40px;height:40px}.call-name{font-size:15px}.call-date{font-size:12px}.call-row-right{gap:4px}.head-main{padding-left:16px;padding-right:16px}}

/* index 잠금화면의 메시지 알림 디자인을 닮은 두 장의 연속 알림 */
#incoming-messages[hidden]{display:none!important}
#incoming-messages{position:fixed;z-index:70;left:12px;right:12px;top:calc(67px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.incoming-message{width:min(100%,520px);min-height:73px;padding:13px 16px;border-radius:21px;display:flex;align-items:center;gap:12px;color:#111;background:#F5F5F7;box-shadow:0 4px 16px rgba(27,36,49,.15);border:1px solid #e6e6e9;animation:incoming-rise .32s cubic-bezier(.22,.78,.2,1) both}
.incoming-message .incoming-icon{height:40px;width:40px;flex:none;border-radius:10px;background:#30D158;display:grid;place-items:center;color:#fff}
.incoming-message .incoming-icon svg{width:29px;height:29px;fill:#fff;stroke:none}
.incoming-copy{min-width:0;flex:1}.incoming-sender{font-size:15px;font-weight:670;line-height:1.4;margin-bottom:3px}.incoming-text{font-size:15px;font-weight:400;line-height:1.45;overflow-wrap:anywhere}
@keyframes incoming-rise{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.call-row.is-static{cursor:default;user-select:none}.call-row.is-static:active{background:#fff;opacity:1}.call-row.is-static .call-row-right{padding-right:4px}
.call-row:not(.is-static){cursor:pointer}.call-row:not(.is-static):active{background:#f4f8fd}
/* 어두운 아이폰 통화 진행 화면 - 오버레이 내의 별도 레이아웃 */
#call-overlay.live-call{position:fixed;inset:0;z-index:100;background:#1e1e1e;color:white;padding:calc(78px + env(safe-area-inset-top,0px)) 15px calc(24px + env(safe-area-inset-bottom,0px));display:block;text-align:center;width:100%;height:100%;height:100dvh;overflow:hidden}
.live-call .call-top{display:flex;flex-direction:column;align-items:center;gap:7px}

.live-call .live-name{font-size:clamp(29px,8vw,35px);font-weight:600;line-height:1.35;letter-spacing:-.7px;color:#fff;margin:0}
.live-call .live-dialogue{position:absolute;left:3%;width:94%;bottom:calc(clamp(249px,39dvh,342px) + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .22s ease;color:#fff;min-height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.live-call .live-speaker{color:#aeb1b7;font-size:13px;font-weight:550;letter-spacing:.2px;line-height:1.4}
.live-call .live-phrase{display:inline-block;flex:none;width:max-content;max-width:none;white-space:nowrap;font-size:18px;line-height:1.5;font-weight:530;letter-spacing:-.55px;word-break:normal;overflow-wrap:normal}
.live-call .live-controls{position:absolute;bottom:calc(clamp(25px,5dvh,67px) + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(100%,410px);padding:0 clamp(21px,6vw,38px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4dvh,22px) 10px;justify-items:center}
.live-call .live-control-wrap{display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0}
.live-call .live-control{height:clamp(59px,17vw,72px);width:clamp(59px,17vw,72px);border-radius:50%;background:#464646;display:grid;place-items:center;color:#fff}
.live-call .live-control svg{width:29px;height:29px;fill:#fff;stroke:none}
.live-call .live-control svg.outline{stroke:white;fill:none;stroke-width:2}
.live-call .live-control-label{color:#fff;font-size:12px;font-weight:430;white-space:nowrap;line-height:1.5}
.live-call button.live-end{background:#FF3B30;cursor:pointer}
.live-call button.live-end:active{background:#e52e28}
.live-call .live-control-wrap:not(:has(button)){cursor:default}

@media(prefers-reduced-motion:reduce){.incoming-message{animation:none}.live-call .live-dialogue{transition:none}}

/* ─────────────────────────────────────────────────────────────
   DBS / 메시지 앱과 동일한 전체 화면 반응형 레이아웃
   고정된 540px · 680px 페이지 프레임을 해제합니다.
   상단과 하단은 브라우저 전체 너비, 본문 콘텐츠만 가운데 정렬.
   기존 목록·문자 알림·통화 시뮬레이션에는 영향을 주지 않습니다.

#app, .top-wrap, #content, .footer {
  width: 100%;
  max-width: none;
}
.top-wrap { border-bottom: 1px solid var(--divider); }
.top-wrap .shell, .footer .shell {
  width: 100%;
  max-width: none;
  margin: 0;
  border-left: 0;
  border-right: 0;
}
#content {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  max-width: none;
  margin: 0;
  border-left: 0;
  border-right: 0;
  overflow-x: hidden;
  overflow-y: auto;
}
.call-list, .record-detail {
  width: 100%;
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
}
.footer {
  display: block;
  flex-shrink: 0;
}
.footer .shell {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
@media (min-width: 700px) {
  .top-wrap .shell, .footer .shell { max-width: none; }
  #content { width: 100%; max-width: none; margin: 0; border: 0; }
  .footer { display: block; }
}

const PATHS={"phone":"<path d=\"M21 16.4v2.9A1.7 1.7 0 0 1 19.1 21a17.9 17.9 0 0 1-7.8-2.8A17.5 17.5 0 0 1 5.8 12.7 17.9 17.9 0 0 1 3 4.9 1.7 1.7 0 0 1 4.7 3h2.9a1.7 1.7 0 0 1 1.7 1.5c.1.9.3 1.8.6 2.6a1.7 1.7 0 0 1-.4 1.8L8.2 10.2a14.2 14.2 0 0 0 5.6 5.6l1.3-1.3a1.7 1.7 0 0 1 1.8-.4c.8.3 1.7.5 2.6.6a1.7 1.7 0 0 1 1.5 1.7Z\"/>","users":"<circle cx=\"12\" cy=\"8\" r=\"3.5\"/><path d=\"M4.5 20a7.5 7.5 0 0 1 15 0\"/>","keypad":"<circle cx=\"6\" cy=\"5.5\" r=\"1.3\"/><circle cx=\"12\" cy=\"5.5\" r=\"1.3\"/><circle cx=\"18\" cy=\"5.5\" r=\"1.3\"/><circle cx=\"6\" cy=\"12\" r=\"1.3\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\"/><circle cx=\"18\" cy=\"12\" r=\"1.3\"/><circle cx=\"6\" cy=\"18.5\" r=\"1.3\"/><circle cx=\"12\" cy=\"18.5\" r=\"1.3\"/><circle cx=\"18\" cy=\"18.5\" r=\"1.3\"/>","message":"<path d=\"M20 11.6a7.6 7.6 0 0 1-7.6 7.6H7L3 22V11.6a8.5 8.5 0 0 1 17 0Z\"/>","video":"<rect x=\"3\" y=\"6.5\" width=\"13\" height=\"11\" rx=\"2.4\"/><path d=\"m16 10 5-3v10l-5-3\"/>"};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${PATHS[name]||PATHS.phone}</svg>`;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const header=document.getElementById('app-header'),content=document.getElementById('content'),tabbar=document.getElementById('tabbar');
let page='recent',filter='all',focusedId=null,savedScroll=0;
const avatarType=name=>name==='윤도운이'?'dw':name==='엄마'||name==='아버지'?'family':/DBS|DKS|기프트|인쇄소|내선|작가/.test(name)?'company':'';
const labelInitial=name=>name==='윤도운이'?'윤':name.startsWith('DBS')?'D':name.startsWith('DKS')?'D':name.startsWith('KK')?'K':name==='엄마'?'엄':name==='아버지'?'아':name==='총무팀 내선'?'총':name==='운운 인쇄소'?'운':name.slice(0,1);
const avatar=(name,big=false)=>`<span class="${big?'big-avatar':'avatar'} ${avatarType(name)}" aria-hidden="true">${esc(labelInitial(name))}</span>`;
const isMissed=c=>c.direction==='부재중 전화';
const dateText=c=>`${c.day} · ${c.time}`;
function renderHeader(){
 if(page==='detail')return `<div class="subhead shell"><button class="back-button" data-action="back" aria-label="최근 통화로 돌아가기">최근 통화</button><div class="subhead-title">통화 정보</div><span class="subhead-right"></span></div>`;
 return `<div class="head-main shell"><div class="head-line"><span class="muted-control" aria-disabled="true">편집</span><div class="segmented" role="tablist" aria-label="통화 종류"><button class="${filter==='all'?'on':''}" data-filter="all" aria-selected="${filter==='all'}">전체</button><button class="${filter==='missed'?'on':''}" data-filter="missed" aria-selected="${filter==='missed'}">부재중</button></div></div><h1 class="header-large">최근 통화</h1></div>`;
}
function renderFooter(){return [['recent','최근 통화','phone'],['contacts','연락처','users'],['keypad','키패드','keypad']].map(([id,title,ico])=> id==='recent'?`<div class="tab active" aria-current="page">${icon(ico)}<span>${title}</span></div>`:`<button class="tab" disabled aria-disabled="true" aria-label="${title}">${icon(ico)}<span>${title}</span></button>`).join('');}
function recentPage(){
 const list=START_CALLS.filter(c=>filter==='all'||isMissed(c));
 return `<div class="call-list">${list.length?list.map(c=>{const first=c.id==='dw1';const tag=first?'button':'div';const attrs=first?`type="button" data-record="dw1" aria-label="윤도운이 오늘 04시 04분 통화 정보"`:'';return `<${tag} class="call-row ${first?'':'is-static'}" ${attrs}>${avatar(c.name)}<span class="call-row-body"><span style="min-width:0;flex:1"><span class="call-name ${isMissed(c)?'missed':''}" style="display:block">${esc(c.name)}</span><span class="call-caption">${esc(c.direction)}${c.label==='회사'?' · 회사':' · 휴대전화'}</span></span><span class="call-row-right"><span class="call-date">${esc(c.day)}</span></span></span></${tag}>`}).join(''):'<div class="empty">통화 기록이 없습니다.</div>'}</div>`;
}
function detailPage(){
 const active=START_CALLS.find(c=>c.id===focusedId);
 if(!active||focusedId!=='dw1')return '<div class="empty">통화 기록을 찾을 수 없습니다.</div>';
 const records=START_CALLS.filter(c=>c.name===active.name);
 return `<div class="record-detail"><section class="detail-hero">${avatar(active.name,true)}<h1 class="detail-name">${esc(active.name)}</h1><div class="detail-label">${esc(active.label==='회사'?'회사':'휴대전화')}</div><div class="detail-actions"><button type="button" class="detail-action" disabled aria-disabled="true">${icon('message')}<span>메시지</span></button><button type="button" class="detail-action" data-action="demo-call">${icon('phone')}<span>통화</span></button><button type="button" class="detail-action" disabled aria-disabled="true">${icon('video')}<span>FaceTime</span></button></div></section><section class="detail-section"><h2 class="section-title">통화 기록</h2><div class="rounded-card">${records.map(c=>`<div class="detail-record"><span class="record-icon ${isMissed(c)?'missed':''}">${icon('phone')}</span><span class="record-center"><span class="record-direction" style="${isMissed(c)?'color:#FF3B30':''}">${esc(c.direction)}</span><div class="record-timestamp">${esc(dateText(c))}</div></span><span class="record-duration">${esc(isMissed(c)?'연결되지 않음':c.duration)}</span></div>`).join('')}</div></section><section class="detail-section"><h2 class="section-title">연락처</h2><div class="rounded-card"><div class="detail-data"><b>${esc(active.name)}</b><span>${active.label==='회사'?'회사':'휴대전화'}</span></div></div></section></div>`;
}
function render(keepScroll=false){const pos=keepScroll?content.scrollTop:0;header.innerHTML=renderHeader();content.innerHTML=page==='detail'?detailPage():recentPage();tabbar.innerHTML=renderFooter();content.style.background=page==='detail'?'#F2F2F7':'#fff';content.scrollTop=pos;}
// 도운이 통화 정보만 열 수 있습니다. 나머지는 버튼 요소가 아닙니다.
const incomingBox=document.getElementById('incoming-messages');
const callLayer=document.getElementById('call-overlay');
const notificationIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.6 1.6 5 4.1 6.4L5 21l4.4-2.2c.8.1 1.7.2 2.6.2 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>';
let messageTimers=[],conversationTimers=[],clockTimer=null,calling=false,callSeconds=0;
function clearMessageTimers(){messageTimers.forEach(clearTimeout);messageTimers=[]}
function clearConversationTimers(){conversationTimers.forEach(clearTimeout);conversationTimers=[];if(clockTimer!==null){clearInterval(clockTimer);clockTimer=null}}
function hideMessages(){clearMessageTimers();incomingBox.innerHTML='';incomingBox.hidden=true}
function appendMessage(text){incomingBox.hidden=false;incomingBox.insertAdjacentHTML('afterbegin',`<div class="incoming-message"><div class="incoming-icon">${notificationIcon}</div><div class="incoming-copy"><div class="incoming-sender">윤도운이</div><div class="incoming-text">${esc(text)}</div></div></div>`)}
function showMessages(){hideMessages();messageTimers.push(setTimeout(()=>appendMessage('나왔어?'),280));messageTimers.push(setTimeout(()=>appendMessage('택시 타면 전화줘'),900));messageTimers.push(setTimeout(hideMessages,5400))}
function openDetail(id){if(id!=='dw1')return;savedScroll=content.scrollTop;focusedId=id;page='detail';render();showMessages()}
function back(){hideMessages();page='recent';focusedId=null;render();content.scrollTop=savedScroll}
const CALL_SCRIPT=[
 {speaker:'윤도운',text:'택시 탔어?'},
 {speaker:'강영현',text:'그냥 자지 뭘 또 기다려'},
 {speaker:'윤도운',text:'걱정되니까 글치'},
 {speaker:'강영현',text:'나 백팔십 남잔디'},
 {speaker:'윤도운',text:'아니 형 말고'},
 {speaker:'윤도운',text:'형이 배고파서 기사님 뜯어먹을까봐'},
 {speaker:'강영현',text:'생일이니까 봐준다'},
 {speaker:'윤도운',text:'바로 또 출근해야 돼?'},
 {speaker:'강영현',text:'으응'},
 {speaker:'강영현',text:'너 나갈 때 같이 나오면 될 듯'},
 {speaker:'윤도운',text:'형 피곤해가 오늘 뭐 하겠나'},
 {speaker:'강영현',text:'뭐 할 건데?'},
 {speaker:'윤도운',text:'아니 뭐 꼭 그거 아니라도... 그냥 쉴래?'},
 {speaker:'강영현',text:'너 거기서 밥 먹으려면 몇 달 기다려야 되는지 알아?'},
 {speaker:'윤도운',text:'밥이 문제가 내 남친 밥 먹다 죽게 생겼는데'},
 {speaker:'강영현',text:'난 밥이 문제야'},
 {speaker:'강영현',text:'아 졸려...'},
 {speaker:'윤도운',text:'끊으까?'},
 {speaker:'강영현',text:'아니이, 목소리 들을래'}
];
const callIcons={
 speaker:'<path d="M11 5 6 9H2v6h4l5 4V5Zm4.5 7c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02ZM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77Z"/>',
 video:'<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4Z"/>',
 mute:'<path d="M12 14c1.66 0 2.99-1.34 2.99-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3Zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7Z"/>',
 dots:'<circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="12" r="2"/>',
 hangup:'<path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9Z"/>',
 keypad:'<circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>'
};
function control(kind,label,enabled=false){const svg=`<svg viewBox="0 0 24 24" aria-hidden="true">${callIcons[kind]}</svg>`;return `<div class="live-control-wrap">${enabled?`<button type="button" class="live-control live-end" data-action="end-call" aria-label="통화 종료">${svg}</button>`:`<div class="live-control" aria-hidden="true">${svg}</div>`}<span class="live-control-label">${label}</span></div>`}
function showCallLine(line){
 const speaker=callLayer.querySelector('#live-speaker'),phrase=callLayer.querySelector('#live-phrase');
 if(speaker)speaker.textContent=line.speaker;
 if(!phrase)return;
 phrase.textContent=line.text;
 // 한 줄로 표시: 글자 수뿐 아니라 iPhone 실제 렌더링 폭에 맞춰 글씨 크기를 조절합니다.
 const parent=phrase.parentElement;
 const allowedWidth=Math.max(120,parent.clientWidth-6);
 let size=18;
 phrase.style.fontSize=size+'px';
 while(phrase.getBoundingClientRect().width>allowedWidth&&size>10){
  size-=0.25;
  phrase.style.fontSize=size+'px';
 }
}
function durationForLine(line){const chars=[...line.text.replace(/\s/g,'')].length;return Math.min(4100,Math.max(1650,950+chars*100))}
function showNextLine(index){if(!calling)return;if(index>=CALL_SCRIPT.length){conversationTimers.push(setTimeout(endCall,1900));return}showCallLine(CALL_SCRIPT[index]);conversationTimers.push(setTimeout(()=>showNextLine(index+1),durationForLine(CALL_SCRIPT[index])))}
function mockCall(){if(page!=='detail'||focusedId!=='dw1'||calling)return;hideMessages();clearConversationTimers();calling=true;callSeconds=0;
 callLayer.className='call-overlay live-call';
 callLayer.innerHTML=`<div class="call-top"><span class="live-status" id="live-status">휴대전화 연결 중...</span><h2 class="live-name">윤도운이</h2></div><div class="live-dialogue"><span class="live-speaker" id="live-speaker"></span><span class="live-phrase" id="live-phrase"></span></div><div class="live-controls">${control('speaker','스피커')}${control('video','FaceTime')}${control('mute','소리 끔')}${control('dots','더 보기')}${control('hangup','종료',true)}${control('keypad','키패드')}</div>`;
 callLayer.hidden=false;
 conversationTimers.push(setTimeout(()=>{if(!calling)return;const status=document.getElementById('live-status');if(status)status.textContent='00:00';clockTimer=setInterval(()=>{if(!calling)return;callSeconds++;const clock=document.getElementById('live-status');if(clock)clock.textContent=`${String(Math.floor(callSeconds/60)).padStart(2,'0')}:${String(callSeconds%60).padStart(2,'0')}`},1000);showNextLine(0)},850));
}
function endCall(){if(!calling)return;calling=false;clearConversationTimers();callLayer.hidden=true;callLayer.innerHTML='';callLayer.className='call-overlay';page='recent';focusedId=null;filter='all';render();content.scrollTop=savedScroll}
document.addEventListener('click',event=>{
 const row=event.target.closest('[data-record]');if(row){openDetail(row.dataset.record);return;}
 const btn=event.target.closest('button');if(!btn||btn.disabled)return;
 if(btn.dataset.filter){filter=btn.dataset.filter;render(true);return;}
 switch(btn.dataset.action){case 'back':back();break;case 'demo-call':mockCall();break;case 'end-call':endCall();break;}
});
render();
window.addEventListener('resize',()=>{
 if(!calling)return;
 const p=callLayer.querySelector('#live-phrase'),s=callLayer.querySelector('#live-speaker');
 if(p&&s&&p.textContent)showCallLine({speaker:s.textContent,text:p.textContent});
});
window.addEventListener('pageshow',event=>{if(event.persisted){hideMessages();calling=false;clearConversationTimers();page='recent';filter='all';focusedId=null;savedScroll=0;callLayer.hidden=true;callLayer.innerHTML='';callLayer.className='call-overlay';render();}});
})();
</script></body></html>
