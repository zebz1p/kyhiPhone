<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>강영현의 iPhone</title>
  <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    /* 한 파일 통합판: 닷홈 페이지 안에 들어가도 기존 테마와 최대한 충돌하지 않게 범위를 분리함 */
    html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#000!important}
    #chs-root,#chs-root *{box-sizing:border-box}
    #chs-root{
      position:fixed;inset:0;z-index:99999;width:100%;height:100%;height:100dvh;
      background:#000;color:#fff;overflow:hidden;isolation:isolate;
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    #chs-root a{color:inherit;text-decoration:none;border:0;-webkit-tap-highlight-color:transparent}
    #chs-root a:focus-visible{outline:2px solid white;outline-offset:3px}
    #chs-root .chs-statusbar{
      position:absolute;left:0;right:0;top:0;z-index:30;pointer-events:none;
      padding:calc(12px + env(safe-area-inset-top,0px)) 22px 0;
      display:flex;justify-content:space-between;align-items:flex-start;
      color:#fff;font-size:15px;font-weight:600;line-height:17px;
    }
    #chs-root .chs-status-left,#chs-root .chs-status-right{
      display:flex;align-items:center;
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
    }
    #chs-root .chs-status-right{gap:7px}
    #chs-root .chs-signal{display:flex;align-items:flex-end;gap:1.5px;height:11px;margin-right:2px}
    #chs-root .chs-signal i{display:block;width:3px;background:#fff;border-radius:1px}
    #chs-root .chs-signal i:nth-child(1){height:40%}
    #chs-root .chs-signal i:nth-child(2){height:60%}
    #chs-root .chs-signal i:nth-child(3){height:80%}
    #chs-root .chs-signal i:nth-child(4){height:100%}
    #chs-root .chs-lte{font-size:11px;font-weight:700;letter-spacing:.5px}
    #chs-root .chs-battery{position:relative;width:27px;height:14px;background:rgba(255,255,255,.4);border-radius:4px;margin-left:2px}
    #chs-root .chs-battery-level{position:absolute;left:0;top:0;width:95%;height:100%;background:#fff;border-radius:4px}
    #chs-root .chs-battery-number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;color:#000;letter-spacing:-.5px}
    #chs-root .chs-battery-cap{position:absolute;right:-3px;top:5px;width:3px;height:4px;background:rgba(255,255,255,.5);border-radius:0 2px 2px 0}

    /* 배경은 검은색, 내용만 스크롤. 상태바와 독은 언제나 고정 */
    #chs-root .chs-scroll-area{
      position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
      padding:calc(72px + env(safe-area-inset-top,0px)) 20px calc(150px + env(safe-area-inset-bottom,0px));
      overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    #chs-root .chs-scroll-area::-webkit-scrollbar{display:none}
    #chs-root .chs-widget-area{width:100%;max-width:350px;display:flex;flex-direction:column;align-items:center;margin:0 auto}
    /* 음악은 실제 재생하지 않음: 이퀄라이저와 진행 막대로 재생 효과만 표시 */
    #chs-root .chs-music-widget{width:100%;min-height:148px;display:block;position:relative;overflow:hidden;border-radius:22px;padding:18px 20px;margin-bottom:30px;background:#242426;color:#fff;transition:transform .15s}
    #chs-root .chs-music-widget:active{transform:scale(.97)}
    #chs-root .chs-music-top{display:flex;align-items:center;gap:14px}
    #chs-root .chs-music-info{flex:1;min-width:0}
    #chs-root .chs-music-caption{display:flex;align-items:center;gap:6px;color:#d0d0d4;font-size:9px;font-weight:700;letter-spacing:1.4px;margin-bottom:7px}
    #chs-root .chs-music-title{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
    #chs-root .chs-music-artist{font-size:12px;color:#b7b7bd;margin-top:4px}
    #chs-root .chs-equalizer{display:flex;align-items:center;gap:2px;height:12px}
    #chs-root .chs-equalizer i{display:block;width:2px;height:10px;border-radius:2px;background:#d0d0d4;animation:chs-eq .9s ease-in-out infinite alternate}
    #chs-root .chs-equalizer i:nth-child(2){animation-delay:-.4s;height:7px}
    #chs-root .chs-equalizer i:nth-child(3){animation-delay:-.7s}
    #chs-root .chs-equalizer i:nth-child(4){animation-delay:-.2s;height:6px}
    #chs-root .chs-pause{display:flex;gap:4px;margin-left:2px}
    #chs-root .chs-pause i{width:4px;height:17px;border-radius:1px;background:#fff}
    #chs-root .chs-music-progress{height:3px;border-radius:4px;background:#ffffff26;margin-top:17px;overflow:hidden}
    #chs-root .chs-music-progress span{display:block;width:32%;height:100%;background:#ffffff;border-radius:4px;animation:chs-progress 160s linear infinite}
    #chs-root .chs-music-footer{display:flex;justify-content:space-between;margin-top:7px;font-size:9px;letter-spacing:.3px;color:#a5a5ad}
    @keyframes chs-eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
    @keyframes chs-progress{from{width:32%}to{width:100%}}
    #chs-root .chs-app-grid{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 15px;justify-items:center}
    #chs-root .chs-app-icon{
      width:62px;height:62px;min-width:0;min-height:0;flex-shrink:0;border-radius:15px;
      display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;
      padding:0;margin:0;background:#fff;transition:transform .15s cubic-bezier(.2,0,0,1)
    }
    #chs-root .chs-app-icon:active{transform:scale(.85)}
    #chs-root .chs-app-icon svg{display:block;width:100%;height:100%;flex:none}
    #chs-root .chs-icon-kakao{background:#fae100}

    /* 하단 독. 앱 그리드와 클래스명을 분리해 CSS 충돌 방지 */
    #chs-root .chs-dock{
      position:absolute;left:50%;transform:translateX(-50%);
      bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:40;
      display:flex;justify-content:space-evenly;align-items:center;
      width:92%;max-width:400px;padding:16px 10px;
      border-radius:35px;background:rgba(255,255,255,.4);
      -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    }
    #chs-root .chs-dock-icon{
      width:62px;height:62px;border-radius:15px;flex-shrink:0;display:flex;
      align-items:center;justify-content:center;overflow:hidden;
      transition:transform .15s cubic-bezier(.2,0,0,1)
    }
    #chs-root .chs-dock-icon:active{transform:scale(.85)}
    #chs-root .chs-dock-icon svg{display:block;width:36px;height:36px;flex:none}
    #chs-root .chs-dock-phone,#chs-root .chs-dock-message{background:linear-gradient(180deg,#5de468 0%,#34c744 100%)}
    #chs-root .chs-dock-intranet{background:#1761da}
    #chs-root .chs-dock-intranet svg{width:100%;height:100%}
    #chs-root .chs-dock-safari{background:#fff}
    #chs-root .chs-dock-safari svg{width:54px;height:54px}
    @media(max-width:345px){
      #chs-root .chs-scroll-area{padding-left:12px;padding-right:12px}
      #chs-root .chs-app-grid{gap:20px 8px}
      #chs-root .chs-app-icon{width:56px;height:56px}
      #chs-root .chs-dock{padding:12px 8px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
      #chs-root .chs-dock-icon{width:54px;height:54px}
    }
    @media(prefers-reduced-motion:reduce){#chs-root .chs-app-icon,#chs-root .chs-dock-icon,#chs-root .chs-music-widget{transition:none}#chs-root .chs-equalizer i,#chs-root .chs-music-progress span{animation:none}}
  </style>
</head>

<script>
/* 4. 가상 시계: 처음 접속하면 08:25, 페이지 이동·새로고침 후에도 경과 시간 이어짐 */
(function(){
  const virtualKey='characterTime_virtualStart';
  const realKey='characterTime_realStart';
  let fallbackVirtual=null;
  let fallbackReal=null;
  function updateVirtualClock(){
    const now=Date.now();
    let savedVirtualStart=null,savedRealStart=null;
    try{
      savedVirtualStart=localStorage.getItem(virtualKey);
      savedRealStart=localStorage.getItem(realKey);
    }catch(error){/* 저장 공간 접근 불가 시 현재 탭 동안만 흐르게 함 */}
    let virtualStart=Number(savedVirtualStart),realStart=Number(savedRealStart);
    if(!savedVirtualStart||!savedRealStart||!Number.isFinite(virtualStart)||!Number.isFinite(realStart)){
      if(fallbackVirtual!==null&&fallbackReal!==null){
        virtualStart=fallbackVirtual;realStart=fallbackReal;
      }else{
        const start=new Date(now);start.setHours(8,25,0,0);
        virtualStart=start.getTime();realStart=now;
        fallbackVirtual=virtualStart;fallbackReal=realStart;
        try{
          localStorage.setItem(virtualKey,String(virtualStart));
          localStorage.setItem(realKey,String(realStart));
        }catch(error){}
      }
    }
    const currentVirtualTime=new Date(virtualStart+(now-realStart));
    const h=currentVirtualTime.getHours();
    const m=String(currentVirtualTime.getMinutes()).padStart(2,'0');
    const timeElement=document.getElementById('iphone-time');
    if(timeElement)timeElement.textContent=h+':'+m;
  }
  updateVirtualClock();
  setInterval(updateVirtualClock,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateVirtualClock()});
})();
</script>
