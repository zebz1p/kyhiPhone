/* ━━━ 윤도운 채팅 자동 답장: 서버 없이, 이번 페이지 접속 동안만 유지 ━━━
   호칭과 다른 말이 함께 쓰이면 실제 내용부터 확인해 답장합니다.
   답변이 여러 개라면 서로 다른 말풍선으로 순서대로 도착합니다. */
const replyTimers=new Set();
function randomDowoonReply(options){return options[Math.floor(Math.random()*options.length)];}
function chooseDowoonReplies(message){
 const text=String(message).trim().replace(/\s+/g,' ');
 const compact=text.replace(/\s/g,'');
 // 내용 키워드를 호칭보다 먼저 판별합니다.
 if(compact.includes('헤어지자'))return ['하지마라고 그거'];
 if(compact.includes('그만하자'))return ['뭘 그만해'];
 if(compact.includes('사랑해'))return randomDowoonReply([
  ['내가 더'],
  ['나도 사랑해'],
  ['뭐고 부끄럽게','내도'],
  ['그럼 애교도 함 부려봐']
 ]);
 if(/보고\s*싶(?:다|어)/.test(text))return randomDowoonReply([
  ['ㅋㅋ 보러가까?','나올 수 있나'],
  ['언제 퇴근해?','빨리 보고 싶다'],
  ['간만에 드라이브 함 하까'],
  ['얼마나?','얼마나 보고 싶은데 강영영~'],
  ['통했는갑다','내 방송국 밑에 카펜데','내려올래?']
 ]);
 if(compact.includes('미워')||compact.includes('밉다'))return ['왜 또 앙탈이고'];
 if(compact.includes('싫어'))return ['뭘 싫어 난 좋아'];
 if(compact.includes('밥은'))return ['대충 먹었다','형은?','밥 거르지 마'];
 if(compact.includes('뭐해'))return ['일하지…'];
 if(compact.includes('어디야'))return ['나 학원'];
 if(compact.includes('어디'))return ['인제 출발한다 10분 이따 내려온나'];
 // 단독 호칭 또는 호칭만 포함된 문장
 if(compact.includes('도운아'))return ['엉'];
 if(compact.includes('도운이')||compact.includes('도우니'))return ['왜 우리 영혀니'];
 if(compact.includes('윤도운'))return ['왜용'];
 if(/(^|\s)야([\s!?~.,]|$)/.test(text))return ['정색하지마라 무섭게'];
 return [];
}
function queueDowoonReply(text,sentMessage){
 const replies=chooseDowoonReplies(text);
 replies.forEach((reply,i)=>{
  const delay=1000+i*900;
  const timer=setTimeout(()=>{
   replyTimers.delete(timer);
   const time=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
   // 도운이가 답장하는 순간, 그 답장을 유발한 메시지까지 읽음 처리합니다.
   // 화면의 메시지 시각만 갱신해 입력하던 내용과 포커스는 유지합니다.
   if(i===0){
    const lastSeenIndex=messages.indexOf(sentMessage);
    if(lastSeenIndex>=0){
     const chatRows=view==='chat'?$('main').querySelectorAll('.lmd-chat-list > .lmd-message'):null;
     messages.forEach((message,index)=>{
      if(index<=lastSeenIndex&&message.from==='me'&&message.new){
       message.new=false;
       const timestamp=chatRows?.[index]?.querySelector('.lmd-chat-time');
       if(timestamp)timestamp.textContent=message.time;
      }
     });
    }
   }
   messages.push({from:'them',text:reply,time,new:true});
   if(view==='chat'){
    // 채팅 말풍선만 추가해 작성 중인 입력과 키보드 포커스를 지킵니다.
    const list=$('main').querySelector('.lmd-chat-list');
    if(list){
     list.insertAdjacentHTML('beforeend',`<div class="lmd-message"><div class="lmd-chat-avatar emoji-chat">${profileEmoji('partner')}</div><div class="lmd-chat-body"><div class="lmd-chat-name">윤도운</div><div class="lmd-bubble">${esc(reply)}</div><div class="lmd-chat-time">${esc(time)}</div></div></div>`);
     $('main').scrollTop=$('main').scrollHeight;
    }
   }
  },delay);
  replyTimers.add(timer);
 });
}

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));if(f.id==='composer'){const text=$('chat-input').value.trim();if(!text)return;const time=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());const sentMessage={from:'me',text,time,new:true};messages.push(sentMessage);draft='';$('chat-input').value='';render();$('main').scrollTop=$('main').scrollHeight;$('chat-input').focus();queueDowoonReply(text,sentMessage)}else if(f.id==='answer-form'){if(answers[0].mine!==null)return;if(!d.answer.trim())return;answers[0].mine=d.answer.trim();answerDraft='';render();toast('도운이의 답변이 열렸어.')}else if(f.id==='wish-form'){if(!d.wish.trim())return;wishes.push({text:d.wish.trim(),done:false});render();toast('우리의 소원이 하나 늘었어.')}else if(f.id==='plan-form'){if(!d.title.trim()||!d.place.trim())return;plans.push(d);plans.sort((a,b)=>a.date.localeCompare(b.date));render();toast('같이 보낼 하루를 적어 뒀어.')}});
window.addEventListener('pageshow',e=>{if(!e.persisted)return;for(const timer of replyTimers)clearTimeout(timer);replyTimers.clear();messages=clone(initialMessages);answers=clone(questions);wishes=clone(initialWishes);plans=clone(initialPlans);used=[];mood='☺️';sharing=true;view='home';arg=null;stack=[];draft='';answerDraft='';$('chat-input').value='';clearTimeout(toast.t);$('toast').hidden=true;render();$('main').scrollTop=0});

$('info-icon').innerHTML=icon('info');$('send-icon').innerHTML=icon('send');render();
})();
</script></body></html>
