    /* 기본 여백 완전 제거 및 전체 스크롤 차단 (내부 목록만 스크롤) */

    html, body { 

      margin: 0 !important; 

      padding: 0 !important; 

      width: 100% !important; 

      height: 100% !important; 

      background-color: #ffffff !important; 

      overflow: hidden !important; 

    }



    /* 화면 전체를 덮는 앱 래퍼 */

    .google-history-wrapper {

      position: fixed !important;

      top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;

      width: 100% !important; height: 100% !important; height: 100dvh !important;

      display: flex; flex-direction: column; 

      background-color: #ffffff; color: #202124; 

      box-sizing: border-box; 

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      z-index: 9999 !important;

    }



    /* 1. 상단 검색바 영역 */

    .top-search-bar {

      display: flex;

      align-items: center;

      padding: 12px 16px;

      padding-top: calc(12px + env(safe-area-inset-top));

      border-bottom: 1px solid #ebebeb; /* 하단 구분선 */

      gap: 16px;

      background-color: #ffffff;

      z-index: 10;

    }



    .plus-icon {

      width: 24px; height: 24px;

      stroke: #3c4043;

      stroke-width: 2;

      stroke-linecap: round;

      fill: none;

    }



    .search-placeholder {

      flex: 1;

      font-size: 16px;

      color: #9aa0a6;

    }



    .right-icons {

      display: flex;

      align-items: center;

      gap: 16px;

    }



    .right-icons svg {

      width: 24px; height: 24px;

      fill: #3c4043;

    }



    /* 2. 검색 내역 목록 영역 (스크롤 가능) */

    .history-list {

      flex: 1;

      overflow-y: auto; 

      padding: 8px 0 40px 0; /* 상하 여백 */

      background-color: #ffffff;

      /* 전체 클릭 방지 (안전장치) */

      pointer-events: auto; 

    }



    /* 개별 검색 내역 아이템 */

    .history-item {

      display: flex;

      align-items: center;

      padding: 14px 20px;

      box-sizing: border-box;

      /* 클릭(터치) 반응 없음 */

    }



    /* 시계 아이콘 */

    .clock-icon {

      width: 20px; height: 20px;

      stroke: #9aa0a6;

      stroke-width: 2;

      fill: none;

      margin-right: 16px;

      flex-shrink: 0;

    }



    /* 검색어 텍스트 */

    .history-text {

      flex: 1;

      font-size: 16px;

      color: #202124;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }



    /* X (지우기) 아이콘 */

    .x-icon {

      width: 14px; height: 14px;

      stroke: #70757a;

      stroke-width: 2;

      stroke-linecap: round;

      fill: none;

      margin-left: 16px;

const home=document.getElementById('google-home');
const historyScreen=document.getElementById('google-history');
const open=document.getElementById('open-history');
function render(){
 const show=location.hash==='#search-history';
 home.hidden=show;historyScreen.hidden=!show;
 document.title=show?'Google 검색 내역 화면':'Google 메인 화면';
 if(show)historyScreen.focus({preventScroll:true});
 else if(document.activeElement===historyScreen)open.focus({preventScroll:true});
}
window.addEventListener('hashchange',render);
window.addEventListener('pageshow',render);
render();
})();</script></body></html>
