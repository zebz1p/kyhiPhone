const iconSet={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-6h6v6"/>',book:'<path d="M4 5.5C7 4 10 4 12 6c2-2 5-2 8-.5V20c-3-1.5-6-1.5-8 0-2-1.5-5-1.5-8 0Z"/><path d="M12 6v14"/>',note:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h6M8 16h4"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-10 16-10 16 0"/>',chevron:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m15 5-7 7 7 7"/>',spark:'<path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7Z"/>',flag:'<path d="M5 22V3m0 2c5-3 10 3 15 0v11c-5 3-10-3-15 0"/>',headphones:'<path d="M4 13V11a8 8 0 0 1 16 0v2M4 13h4v7H6a2 2 0 0 1-2-2ZM20 13h-4v7h2a2 2 0 0 0 2-2Z"/>',medal:'<circle cx="12" cy="15" r="5"/><path d="M8 3 6 8l4 3M16 3l2 5-4 3M10 15l1.5 1.5 3-3"/>',asterisk:'<path d="M12 2.3v19.4M2.3 12h19.4M5.14 5.14l13.72 13.72M18.86 5.14 5.14 18.86"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 1.7v2.8M12 19.5v2.8M1.7 12h2.8M19.5 12h2.8M4.7 4.7l2 2M17.3 17.3l2 2M19.3 4.7l-2 2M6.7 17.3l-2 2"/>',diamond:'<path d="M12 2 22 12 12 22 2 12Z"/>',shine:'<path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="currentColor" stroke="none"/>',starfill:'<path d="m12 2 3.1 6.5 7.1 1-5.2 5 1.25 7.1L12 18.25l-6.25 3.35L7 14.5l-5.2-5 7.1-1Z" fill="currentColor" stroke="none"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',check:'<path d="m4 12 5 5 11-11"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${iconSet[name]||iconSet.spark}</svg>`;
// 기기에 따라 이모지 그림으로 대체되는 특수기호는 SVG로 고정해서 렌더링합니다.
const symbolMap={'✦':'shine','★':'starfill','☀':'sun','◇':'diamond','✳':'asterisk'};
const decorativeIcon=(value)=>symbolMap[value]?icon(symbolMap[value]):esc(value);
const clamp=(x,max=100)=>Math.max(0,Math.min(max,Number(x)||0));
let view='home';
function header(){ $('brand-title').textContent=CONFIG.app.brand;$('brand-caption').textContent=CONFIG.app.tagline;$('mini-avatar').textContent=CONFIG.profile.initials; }
function nav(){return [['home','오늘','home'],['practice','연습','book'],['notes','노트','note'],['profile','마이','person']].map(([id,title,ico])=>`<button ${id==='practice'||id==='notes'?'data-inert="true"':'data-go="'+id+'"'} class="${view===id?'active':''}" aria-label="${title}" ${(view===id)?'aria-current="page"':''}><span class="nav-icon">${icon(ico)}</span><span>${title}</span></button>`).join('')}
const kicker=(label)=>`<div class="kicker"><span class="seed"></span>${esc(label)}</div>`;
const section=(title,extra='')=>`<div class="section"><h2>${esc(title)}</h2>${extra?`<span class="meta">${esc(extra)}</span>`:''}</div>`;
function home(){const a=CONFIG.app,t=CONFIG.today;return `<div class="page">
${kicker(a.languageTag)}<h1 class="page-headline">오늘도 영어 한 스푼,<br>차곡차곡 쌓아 봐요.</h1><p class="subtitle">${esc(a.date)} · 오늘의 작은 배움</p>
<div class="sunny"><span class="sunny-decoration" aria-hidden="true">${icon('asterisk')}</span><div class="sunny-top"><span class="sunny-tag">${esc(a.heroLabel)}</span><span class="sunny-day">${esc(t.number)}</span></div><div class="quote-mark">“</div><h2 class="sentence">${esc(t.sentence)}</h2><p class="translation">${esc(t.translation)}</p><div class="sunny-foot"><span>${esc(t.type)}</span><span class="wave" aria-label="오디오 파형"><i></i><i></i><i></i><i></i><i></i></span></div></div>
${section('오늘의 포인트','LET’S LEARN')}<div class="card grammar"><div class="grammar-icon">${icon('spark')}</div><div><h3>Bore (someone) to death</h3><p>${esc(t.tip)}</p></div></div><div class="card sample"><div class="sample-head">${icon('shine')} EXAMPLE</div><p class="sample-english">${esc(t.example)}</p><p class="sample-korean">${esc(t.exampleTranslation)}</p></div>
${section('오늘 기억할 단어')}<div class="card word-card"><span class="word-icon">Aa</span><span class="grow"><b>${esc(t.word)}</b><p>${esc(t.meaning)}</p></span>${icon('chevron')}</div>
<button class="ghost-cta" data-go="profile"><span><b>나의 학습 기록 보러 가기</b><p>영어 실력과 진도를 확인해 보세요.</p></span>${icon('chevron')}</button><p class="profile-footer">${esc(a.footer)}</p></div>`}
function medal(){return `<div class="score-medal">${icon('medal')}</div>`}
function chart(){const months=CONFIG.months||[];const highest=Math.max(25,...months.map(m=>Number(m.days)||0));return `<div class="card chart"><div class="chart-axis">${months.map(m=>`<div class="chart-col"><span class="chart-num">${esc(m.days)}</span><div class="chart-bar" style="height:${Math.max(5,clamp(m.days/highest*100))}%"></div></div>`).join('')}</div><div class="chart-labels">${months.map(m=>`<span>${esc(m.label)}</span>`).join('')}</div><p class="chart-foot">이번 달 <b>${esc(CONFIG.goals.chartMonthSummary)}</b> 학습 · 매달 조금씩 성장 중!</p></div>`}
function friendRow(f,featured=false){const style=['lavender','mint','peach','sky','sand'].includes(f.color)?f.color:'sand';return `<div class="friend ${featured?'friend-favorite':''}"><div class="friend-face ${style}">${esc(f.initials)}</div><div class="friend-body"><div class="friend-name">${esc(f.name)}${f.favorite?'<span class="star">'+icon('starfill')+'</span>':''}</div><p class="friend-detail">${esc(f.language)} 학습 중</p></div><div class="last">최근 접속<b>${esc(f.lastActive)}</b></div></div>`}
function profile(){const p=CONFIG.profile,g=CONFIG.goals,friendList=CONFIG.friends||[];const favorites=friendList.filter(f=>f.favorite),other=friendList.filter(f=>!f.favorite);return `<div class="page">
${kicker('MY LANGUAGE SPACE')}<h1 class="page-headline">나의 공부 기록<span style="color:#edba2d">.</span></h1><p class="subtitle">한 문장 한 문장이 모여 만든 나의 성장</p>
<div class="profile-hero"><span class="profile-decoration" aria-hidden="true">${icon('asterisk')}</span><div class="profile-row"><div class="profile-photo">${esc(p.initials)}</div><div><h1>${esc(p.name)}</h1><p>@${esc(p.nickname)}</p></div></div><span class="level">${icon('shine')} ${esc(p.level)} LEARNER</span><div class="profile-sub"><div><p class="caption">선택한 학습 언어</p><div class="lang-row"><span class="flag">${esc(p.languageFlag)}</span><span>${esc(p.language)} · ${esc(p.languageEnglish)}</span></div></div><span class="caption">SINCE ${esc(p.joined)}</span></div></div>
<div class="score"><div><p class="score-title">MY TOEIC SCORE</p><b>${esc(p.toeic)}<span>/ ${esc(p.toeicMax)}</span></b><p class="score-sub">목표 점수 ${esc(p.targetToeic)}점까지 도전 중!</p></div>${medal()}</div>
<div class="stat-grid"><div class="stat-tile"><b>${esc(p.studyStreak)}<span class="unit">일</span></b><p>연속 학습</p></div><div class="stat-tile"><b>${esc(p.totalHours)}<span class="unit">h</span></b><p>누적 학습 시간</p></div><div class="stat-tile"><b>${esc(p.completionRate)}<span class="unit">%</span></b><p>학습 달성률</p></div></div>
${section('이번 달의 목표','AUGUST')}<div class="card progress-card"><div class="progress-top"><div><p class="progress-label">월간 목표 학습일</p><strong>${esc(g.monthlyDone)}<span> / ${esc(g.monthlyTarget)}일</span></strong></div><span style="font-size:13px;color:#ad8a2e;font-weight:850">${Math.round(clamp(g.monthlyDone/Math.max(1,g.monthlyTarget)*100))}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${clamp(g.monthlyDone/Math.max(1,g.monthlyTarget)*100)}%"></div></div><p class="progress-desc">${esc(g.monthlyDescription)}</p><div class="daily-row"><span>오늘의 학습 목표</span><b>${esc(g.dailyDone)} / ${esc(g.dailyTarget)}분</b></div><div class="daily-bar"><span style="width:${clamp(g.dailyDone/Math.max(1,g.dailyTarget)*100)}%"></span></div></div>
${section('월별 학습 진도','최근 6개월')}${chart()}
${section('학습 배지',esc(CONFIG.achievements.length)+'개 획득')}<div class="achievement-list">${CONFIG.achievements.map(a=>`<div class="achievement"><div class="mark">${decorativeIcon(a.icon)}</div><b>${esc(a.name)}</b><p>${esc(a.detail)}</p></div>`).join('')}</div>
${section('내 친구',esc(p.friendCountDisplay))}<div class="card friend-list">${favorites.length?`<div class="friend-group">${icon('starfill')} 즐겨찾는 친구</div>${favorites.map(f=>friendRow(f,true)).join('')}`:''}${other.length?`<div class="friend-group">FRIENDS</div>${other.map(f=>friendRow(f)).join('')}`:''}</div>
${section('최근 학습 기록')}<div class="card history">${CONFIG.activity.map(a=>`<div class="history-row"><span class="history-icon">${decorativeIcon(a.icon)}</span><div class="grow"><b>${esc(a.title)}</b><p>${esc(a.detail)}</p></div><span class="history-date">${esc(a.date)}</span></div>`).join('')}</div><p class="profile-footer"><br>${esc(CONFIG.app.footer)}</p></div>`}
function render(){
 header();
 $('main').innerHTML=view==='profile'?profile():home();
 $('bottom').innerHTML=nav();
}
function go(v){
 if(v!=='home'&&v!=='profile')return;
 view=v;
 render();
 $('main').scrollTop=0;
}
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');
 if(!btn)return;
 if(btn.dataset.go)go(btn.dataset.go);
});
render();
})();
</script></body></html>
